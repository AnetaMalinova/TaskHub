<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7342cb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TaskHub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TaskHub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<!-- Písmo Plus Jakarta Sans: SIL Open Font License 1.1 (komerční použití povoleno). V nativní verzi bude přibalené kvůli offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== TOKENY =====
   Layout: jeden sloupec pro palec. Fialová hlavička s rychlým zápisem, pak návyky, priority, oblasti, týden.
   Vizuální svět: světlá levandule, bílé karty, jedna sytá fialová, navigace jako pilulka. */
:root{
  color-scheme: light;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --device-bg:#ecebf0;
  --device-frame:#1c1633;
  --device-ring:#d9d7e0;
  --c-bg:#f2effa;
  --c-surface:#ffffff;
  --c-surface-2:#f7f4fd;
  --c-text:#1c1633;
  --c-muted:#6b6489;
  --c-faint:#a7a2c2;
  --c-accent:#7342cb;
  --c-accent-2:#8455d6;
  --c-accent-soft:#ece5f8;
  --c-on-accent:#ffffff;
  --c-stroke:#e6e0f3;
  --c-good:#12a877;
  --c-warn:#c98200;
  --c-crit:#e5487a;

  --f-display:"Plus Jakarta Sans", -apple-system, "SF Pro Display", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", -apple-system, "SF Pro Text", system-ui, sans-serif;

  --fs-xs:.75rem; --fs-sm:.8125rem; --fs-md:.9375rem; --fs-lg:1.125rem; --fs-xl:1.5rem; --fs-xxl:1.75rem;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  --r-sm:12px; --r-md:16px; --r-lg:24px; --r-xl:30px; --r-pill:999px;
  --tap:44px;
  --shadow:0 8px 24px rgba(115,66,203,.08), 0 1px 2px rgba(115,66,203,.06);
  --shadow-accent:0 10px 24px rgba(115,66,203,.32);
  --t-fast:160ms;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--c-bg);
  color:var(--c-text);
  font-family:var(--f-body);
  font-size:var(--fs-md);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg span{position:absolute;border-radius:50%;filter:blur(80px)}
.bg .b1{width:360px;height:360px;background:#ddd0f5;top:-120px;right:-140px;opacity:.7}
.bg .b2{width:300px;height:300px;background:#f6d9f3;top:55%;left:-160px;opacity:.55}
.bg .b3{display:none}

.app{
  position:relative;z-index:1;
  max-width:480px;margin:0 auto;
  padding:0 var(--sp-4) calc(var(--sab) + 108px);
  display:flex;flex-direction:column;gap:var(--sp-6);
}

.glass{
  background:var(--c-surface);
  border:1px solid var(--c-stroke);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,.area:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Fialová hlavička */
.hero{
  background:var(--c-accent);
  color:var(--c-on-accent);
  margin:0 calc(-1 * var(--sp-4));
  border-radius:0 0 var(--r-xl) var(--r-xl);
  padding:calc(var(--sat) + var(--sp-8)) var(--sp-5) var(--sp-5);
  display:flex;flex-direction:column;gap:var(--sp-4);
  box-shadow:var(--shadow-accent);
  position:relative;overflow:hidden;
}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);position:relative;z-index:1}
.top h1{font-family:var(--f-display);font-size:var(--fs-xl);line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.top .greet{font-size:var(--fs-sm);font-weight:500;color:rgba(255,255,255,.75);margin-bottom:4px}
.icon-btn{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:var(--r-md);background:rgba(255,255,255,.16);color:#fff}

/* Rychlý zápis */
.capture{display:flex;align-items:center;gap:var(--sp-2);padding:4px 4px 4px var(--sp-4);background:#fff;border-radius:var(--r-pill);position:relative;z-index:1}
.capture input{flex:1;min-width:0;height:var(--tap);background:none;border:0;color:var(--c-text);font:inherit;font-size:1rem;font-weight:400}
.capture input::placeholder{color:var(--c-faint);font-weight:400}
.capture input:focus{outline:none}
.capture:focus-within{box-shadow:0 0 0 3px rgba(255,255,255,.4)}
.btn-accent{
  height:var(--tap);min-width:var(--tap);padding:0 var(--sp-3);border-radius:var(--r-pill);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  background:var(--c-accent);color:#fff;font-weight:700;
}
.capture-meta{display:flex;justify-content:space-between;font-size:var(--fs-sm);font-weight:400;color:rgba(255,255,255,.85);padding:0 var(--sp-2);position:relative;z-index:1}

.link-u{color:rgba(255,255,255,.62);font-size:var(--fs-xs);font-weight:400;text-decoration:underline;text-decoration-color:rgba(255,255,255,.3);text-decoration-thickness:1px;text-underline-offset:3px;min-height:var(--tap);margin:-14px 0;display:inline-flex;align-items:center}
.link-pill{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 6px 0 12px;margin:-6px 0;border-radius:var(--r-pill);background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:var(--fs-xs);position:relative}
.link-pill::after{content:"";position:absolute;inset:-6px 0}
.link-pill .icon{width:16px;height:16px}
.lead{margin:0;padding:0 var(--sp-1);color:var(--c-muted);font-size:var(--fs-sm)}
.inbox-row{gap:var(--sp-1);padding-right:var(--sp-3)}
.icon-btn-plain{width:var(--tap);height:var(--tap);display:grid;place-items:center;color:var(--c-faint);border-radius:var(--r-md);flex:none}
.btn-sort{height:36px;padding:0 var(--sp-4);border-radius:var(--r-pill);background:var(--c-accent-soft);color:var(--c-accent);font-weight:700;font-size:var(--fs-sm);flex:none;position:relative}
.btn-sort::after{content:"";position:absolute;inset:-4px 0}
.area-pick{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.pick{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 6px;border-radius:var(--r-pill);background:var(--c-surface);border:1.5px solid var(--c-stroke);font-weight:600;font-size:var(--fs-sm);text-align:left;position:relative}
.pick::after{content:"";position:absolute;inset:-4px 0}
.pick .ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--area-c) 14%,#fff);color:var(--area-c);flex:none}
.pick .ico .icon{width:15px;height:15px}
.pick[aria-checked="true"]{border-color:var(--c-accent);background:var(--c-accent-soft)}
.btn-wide{width:100%;height:52px;font-size:var(--fs-md)}
.btn-accent:disabled{opacity:.4;cursor:default}

/* Sekce */
.section{display:flex;flex-direction:column;gap:var(--sp-3)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2);padding:0 var(--sp-1)}
.section-head h2{font-family:var(--f-display);font-size:var(--fs-lg);font-weight:800;margin:0;letter-spacing:-.01em}
.section-head .meta{color:var(--c-muted);font-size:var(--fs-sm);font-weight:600;font-variant-numeric:tabular-nums}

/* Návyky */
.habits{display:flex;gap:var(--sp-3);overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 14px;margin:-4px -4px -10px;scrollbar-width:none}
.habits::-webkit-scrollbar{display:none}
.habit{
  flex:0 0 136px;scroll-snap-align:start;padding:var(--sp-4) var(--sp-3);
  display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-3);text-align:left;
  transition:transform var(--t-fast),background var(--t-fast);
}
.habit:active{transform:scale(.97)}
.habit.is-done{background:var(--c-accent);border-color:var(--c-accent);color:#fff;box-shadow:var(--shadow-accent)}
.ring{position:relative;width:44px;height:44px}
.ring svg{width:44px;height:44px;transform:rotate(-90deg)}
.ring .track{stroke:var(--c-accent-soft)}
.habit.is-done .ring .track{stroke:rgba(255,255,255,.25)}
.ring .val{transition:stroke-dashoffset 400ms ease}
.ring .mark{position:absolute;inset:0;display:grid;place-items:center}
.habit .name{font-weight:700;font-size:var(--fs-md);line-height:1.25}
.habit .sub{display:flex;align-items:center;gap:var(--sp-1);color:var(--c-muted);font-size:var(--fs-xs);font-weight:600;font-variant-numeric:tabular-nums}
.habit .sub .icon{width:14px;height:14px}
.habit.is-done .sub{color:rgba(255,255,255,.85)}

/* Priority */
.list{padding:var(--sp-1) 0;overflow:hidden}
.list:has(> .subhead:first-child){padding-top:0}
.row{display:flex;align-items:center;gap:var(--sp-3);min-height:62px;padding:var(--sp-2) var(--sp-4);position:relative}
.row + .row{border-top:1px solid var(--c-stroke)}
.row .stripe{position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0}
.check{width:var(--tap);height:var(--tap);margin:-6px -6px -6px -10px;flex:none;display:grid;place-items:center}
.check span{width:24px;height:24px;border-radius:8px;border:2px solid #d3c8ec;display:grid;place-items:center;transition:all var(--t-fast);background:#fff}
.check[aria-checked="true"] span{background:var(--c-accent);border-color:var(--c-accent)}
.check .icon{width:14px;height:14px;stroke-width:3;opacity:0;stroke:#fff}
.check[aria-checked="true"] .icon{opacity:1}
.proj-ico{width:24px;height:24px;flex:none;display:grid;place-items:center}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .title{font-weight:600;overflow-wrap:anywhere}
.title-link{text-align:left;padding:4px 0;margin:-4px 0;cursor:pointer}
.title-link:active{color:var(--c-accent)}
.row.is-done .title{color:var(--c-faint);text-decoration:line-through}
.row .tags{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);font-size:var(--fs-xs);color:var(--c-muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:var(--r-pill);font-size:.6875rem;font-weight:700}
.pill.p1{background:#fde7ef;color:var(--c-crit)}
.pill.p2{background:#fdf1d8;color:var(--c-warn)}
.pill.p3{background:var(--c-surface-2);color:var(--c-muted);box-shadow:inset 0 0 0 1px var(--c-stroke)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.progress{height:6px;border-radius:var(--r-pill);background:var(--c-accent-soft);overflow:hidden;margin-top:4px}
.progress i{display:block;height:100%;border-radius:inherit;background:var(--c-accent)}
.expand{width:var(--tap);height:var(--tap);display:grid;place-items:center;margin-right:-10px;color:var(--c-muted);flex:none}
.expand .icon{transition:transform var(--t-fast)}
.expand[aria-expanded="true"] .icon{transform:rotate(180deg)}
.subtasks{padding:0 var(--sp-4) var(--sp-3) 54px;display:flex;flex-direction:column}
.subtask{display:flex;align-items:center;gap:var(--sp-2);min-height:var(--tap);font-size:var(--fs-sm);font-weight:500}
.subtask .check{margin:0 0 0 -10px}
.subtask .check span{width:20px;height:20px;border-radius:6px}
.subtask.is-done .label{color:var(--c-faint);text-decoration:line-through}
.empty{padding:var(--sp-6) var(--sp-4);text-align:center;color:var(--c-muted);font-size:var(--fs-sm)}

/* Činnosti pro dnešek: skupiny podle oblastí */
.groups{display:flex;flex-direction:column;gap:var(--sp-2)}
.group{overflow:hidden;border-radius:var(--r-md)}
.group-head{width:100%;display:flex;align-items:center;gap:var(--sp-3);min-height:60px;padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-3);text-align:left}
.group-head .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--area-c) 14%,#fff);color:var(--area-c);flex:none}
.g-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.g-name{font-weight:700}
.g-row{flex-direction:row;align-items:center;gap:var(--sp-2)}
.g-count{min-width:22px;height:22px;padding:0 7px;border-radius:var(--r-pill);background:var(--c-accent-soft);color:var(--c-accent);font-size:var(--fs-xs);font-weight:800;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.g-count.zero{background:#e3f6ee;color:var(--c-good)}
.g-count .icon{width:12px;height:12px;stroke-width:3}
.g-meta{font-size:var(--fs-xs);color:var(--c-muted);font-weight:500;display:flex;align-items:center;gap:4px}
.g-chev{width:32px;height:32px;display:grid;place-items:center;color:var(--c-muted)}
.g-chev .icon{transition:transform var(--t-fast)}
.group.is-open .g-chev .icon{transform:rotate(180deg)}
.group-list{border-top:1px solid var(--c-stroke)}
.group-list .row{padding-left:var(--sp-4)}

/* Hlavička: text vedle tlačítek */
.top-txt{flex:1;min-width:0}
.top-txt h1{overflow-wrap:anywhere}

/* Detail oblasti */
.dir-block{border-left:4px solid var(--area-c)}
.dir-block h4{color:var(--area-c)}
.add-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-2);border:2px dashed #d3c8ec;border-radius:var(--r-lg);background:transparent;color:var(--c-accent);font-weight:700;min-height:156px}
.add-tile .icon{width:28px;height:28px}

/* Karty návyků */
.hcards{display:flex;flex-direction:column;gap:var(--sp-3)}
.hcard{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3)}
.hc-head{display:flex;align-items:center;gap:var(--sp-3)}
.hc-head .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--area-c) 14%,#fff);color:var(--area-c);flex:none}
.hc-txt{flex:1;min-width:0}
.hc-name{font-weight:700}
.hc-meta{font-size:var(--fs-xs);color:var(--c-muted)}
.hc-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hc-day{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:var(--tap);padding:2px 0}
.hc-day .d-l{font-size:.625rem;font-weight:600;color:var(--c-faint);text-transform:uppercase}
.hc-day .d-c{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-sm);font-weight:600;color:var(--c-muted);background:var(--c-surface-2);border:1.5px solid var(--c-stroke)}
.hc-day.today .d-c{border-color:var(--c-accent);color:var(--c-accent)}
.hc-day.on .d-c{background:var(--area-c);border-color:var(--area-c);color:#fff}
.hc-day .d-c .icon{width:16px;height:16px;stroke-width:3}
.hc-foot{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--c-muted);font-weight:600}
.hc-foot span{display:inline-flex;align-items:center;gap:4px}
.hc-foot .icon{width:14px;height:14px}

/* Formuláře v panelu */
.form{display:flex;flex-direction:column;gap:var(--sp-4)}
.field{display:flex;flex-direction:column;gap:var(--sp-2)}
.flabel{font-size:var(--fs-sm);color:var(--c-muted);font-weight:700}
.input{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--c-stroke);background:#fff;padding:0 14px;font:inherit;font-size:16px;color:var(--c-text)}
textarea.input{padding:12px 14px;resize:vertical;line-height:1.4}
.input:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 3px var(--c-accent-soft)}
.form .f-project,.form .f-recurring,.form .f-weekly{display:none}
.form[data-type="project"] .f-project,.form[data-type="recurring"] .f-recurring,.form[data-freq="weekly"] .f-weekly{display:flex}
.seg label{position:relative;display:inline-flex}
.seg label input{position:absolute;opacity:0;pointer-events:none}
.seg label span{height:38px;padding:0 var(--sp-3);border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:700;color:var(--c-muted);display:inline-flex;align-items:center;cursor:pointer}
.seg label input:checked + span{background:var(--c-accent);color:#fff}
.seg label input:focus-visible + span{outline:2px solid var(--c-accent);outline-offset:2px}
.seg{flex-wrap:wrap;align-self:flex-start}
label.pick{position:relative;cursor:pointer}
label.pick input{position:absolute;opacity:0;pointer-events:none}
label.pick:has(input:checked){border-color:var(--c-accent);background:var(--c-accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.chip-ico,.chip-col{position:relative;cursor:pointer}
.chip-ico input,.chip-col input{position:absolute;opacity:0;pointer-events:none}
.chip-ico span{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#fff;border:2px solid var(--c-stroke);color:var(--c-muted)}
.chip-ico input:checked + span{border-color:var(--c-accent);background:var(--c-accent-soft);color:var(--c-accent)}
.chip-col span{width:44px;height:44px;border-radius:50%;display:block;border:3px solid #fff;box-shadow:0 0 0 1px var(--c-stroke)}
.chip-col input:checked + span{box-shadow:0 0 0 3px var(--c-accent)}
.chip-ico input:focus-visible + span,.chip-col input:focus-visible + span{outline:2px solid var(--c-accent);outline-offset:2px}
.btn-wide-ghost{width:100%}
.icon-btn.icon-btn-bare{background:none;margin-left:-12px;width:40px}
.icon-btn-bare .icon{width:24px;height:24px}
.gchips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.gchips:empty{display:none}
.gchip{display:inline-flex;align-items:center;gap:2px;height:36px;padding:0 4px 0 12px;border-radius:var(--r-pill);background:var(--c-accent-soft);color:var(--c-accent);font-weight:600;font-size:var(--fs-sm)}
.gchip button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--c-accent);position:relative}
.gchip button::after{content:"";position:absolute;inset:-8px -4px}
.gchip .icon{width:14px;height:14px;stroke-width:2.4}
.gadd{display:flex;gap:var(--sp-2);align-items:center}
.gadd .btn-accent{width:48px;height:48px;border-radius:14px;flex:none}
.link-muted{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 var(--sp-1);color:var(--c-accent);font-size:var(--fs-sm);font-weight:600}
.link-muted .icon{width:16px;height:16px}
.subhead{padding:10px var(--sp-4) 4px;font-size:var(--fs-xs);font-weight:700;color:var(--c-muted);background:var(--c-surface-2);border-top:1px solid var(--c-stroke)}
.group-list > .subhead:first-child,.list > .subhead:first-child{border-top:0}
.pick-plain{padding:0 14px}
.field[hidden]{display:none}
.btn-x{width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;background:var(--c-surface);border:1px solid var(--c-stroke);color:var(--c-muted);flex:none}
.btn-x .icon{width:18px;height:18px;stroke-width:2.2}
.field-inline{flex-direction:row;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.field-inline .seg{align-self:auto}
.form .seg{padding:3px}
.form .seg label span{height:30px;padding:0 10px;font-size:var(--fs-xs)}
.btn-skip{flex:none;height:32px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--c-stroke);background:var(--c-surface-2);color:var(--c-muted);font-size:var(--fs-xs);font-weight:600;position:relative;white-space:nowrap}
.btn-skip::after{content:"";position:absolute;inset:-6px -2px}
.check:disabled{cursor:default;opacity:.7}

/* Oblasti */
.areas{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.area{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);text-align:left;min-height:156px;transition:transform var(--t-fast)}
.area:active{transform:scale(.98)}
.area .ico,.sheet-head .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--area-c) 14%,#fff);color:var(--area-c);flex:none}
.area .name{font-family:var(--f-display);font-weight:800;font-size:var(--fs-md)}
.area .dir{font-size:var(--fs-xs);color:var(--c-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.area .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-xs);color:var(--c-muted);font-weight:600;font-variant-numeric:tabular-nums}
.area .dots{display:flex;gap:3px}
.area .dots i{width:6px;height:6px;border-radius:2px;background:var(--c-stroke)}
.area .dots i.on{background:var(--area-c)}

/* Týden */
.week{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-4)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.kpi{background:var(--c-surface-2);border-radius:var(--r-md);padding:var(--sp-3)}
.kpi .label{font-size:var(--fs-xs);color:var(--c-muted);font-weight:600}
.kpi .num{font-family:var(--f-display);font-size:var(--fs-xl);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .num small{font-size:var(--fs-sm);color:var(--c-muted);font-weight:600;margin-left:2px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--c-faint);font-size:10px;font-family:var(--f-body);font-weight:600}
.chart .today-l{fill:var(--c-accent);font-weight:800}
.chart .grid{stroke:var(--c-stroke)}
.chart .bar{fill:var(--c-accent-soft)}
.review{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border-radius:var(--r-md);background:var(--c-accent-soft);color:var(--c-accent)}
.review .txt{flex:1;min-width:0;color:var(--c-text)}
.review .txt b{display:block;font-size:var(--fs-sm)}
.review .txt span{font-size:var(--fs-xs);color:var(--c-muted)}
.btn-ghost{height:36px;padding:0 var(--sp-4);border-radius:var(--r-pill);background:var(--c-accent);color:#fff;font-size:var(--fs-sm);font-weight:700;min-width:var(--tap);position:relative}
.btn-ghost::after{content:"";position:absolute;inset:-4px 0}

/* Navigace jako pilulka (jemné sklo) */
.tabbar{
  position:fixed;z-index:5;left:50%;transform:translateX(-50%);
  bottom:calc(var(--sab) + 12px);
  width:min(448px,calc(100% - 32px));
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.82);border:1px solid var(--c-stroke);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 12px 30px rgba(115,66,203,.16);
}
.tab{height:52px;border-radius:var(--r-pill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.6875rem;font-weight:600;color:var(--c-muted);position:relative}
.tab[aria-current="page"]{color:#fff;background:var(--c-accent);box-shadow:0 6px 14px rgba(115,66,203,.35)}
.tab .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--c-crit);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}

.section-head{align-items:center}
.btn-plus{width:var(--tap);height:var(--tap);display:grid;place-items:center;background:none;color:var(--c-accent);margin:-10px -10px -10px 0;flex:none}
.btn-plus .icon{width:24px;height:24px;stroke-width:2.4}
/* Rychlý zápis pod dnešními činnostmi */
.capture-card{background:var(--c-accent);border-radius:var(--r-xl);padding:var(--sp-4) var(--sp-4) var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-3);box-shadow:var(--shadow-accent);color:#fff}

/* Plovoucí tlačítko pro nový úkol */
.fab{position:fixed;z-index:6;right:max(16px,calc(50% - 224px));bottom:calc(var(--sab) + 92px);width:56px;height:56px;border-radius:50%;
  display:grid;place-items:center;background:var(--c-accent);color:#fff;box-shadow:0 10px 24px rgba(115,66,203,.45);transition:transform var(--t-fast),opacity var(--t-fast)}
.fab .icon{width:26px;height:26px;stroke-width:2.4}
.fab:active{transform:scale(.94)}
.toast:not([hidden]) ~ .fab{opacity:0;pointer-events:none}
@media (min-width:600px) and (min-height:640px){ .fab{right:16px} }

/* Sheet + dialog */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(28,22,51,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{
  width:100%;max-width:480px;max-height:86%;overflow:auto;
  border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--sp-3) var(--sp-5) calc(var(--sab) + var(--sp-6));
  background:var(--c-bg);
  display:flex;flex-direction:column;gap:var(--sp-3);
  animation:up 240ms ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grabber{width:40px;height:5px;border-radius:3px;background:#d6cbee;margin:0 auto}
.sheet-head{display:flex;align-items:center;gap:var(--sp-3)}
.sheet-head h3{flex:1;margin:0;font-family:var(--f-display);font-size:var(--fs-xl);font-weight:800}
.block{padding:var(--sp-4);border-radius:var(--r-lg);background:var(--c-surface);border:1px solid var(--c-stroke);display:flex;flex-direction:column;gap:var(--sp-2)}
.block h4{margin:0;font-size:var(--fs-sm);color:var(--c-accent);font-weight:700}
.block p{margin:0}
.btn-row{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.btn{height:var(--tap);padding:0 var(--sp-4);border-radius:var(--r-pill);background:var(--c-surface);border:1px solid var(--c-stroke);font-weight:700;font-size:var(--fs-sm);color:var(--c-accent)}
.btn.danger{color:var(--c-crit);border-color:#f7c7d7}
.seg{display:inline-flex;padding:4px;border-radius:var(--r-pill);background:var(--c-surface-2);border:1px solid var(--c-stroke)}
.seg button{height:38px;padding:0 var(--sp-4);border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:700;color:var(--c-muted)}
.seg button[aria-pressed="true"]{background:var(--c-accent);color:#fff}
.note{font-size:var(--fs-xs);color:var(--c-muted)}
textarea.dump{width:100%;min-height:90px;border-radius:var(--r-sm);background:var(--c-surface-2);color:var(--c-muted);border:1px solid var(--c-stroke);font:12px/1.4 ui-monospace,Menlo,monospace;padding:var(--sp-2)}
.dialog{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:var(--sp-6);background:rgba(28,22,51,.4)}
.dialog[hidden]{display:none}
.dialog .box{max-width:340px;width:100%;padding:var(--sp-5);border-radius:var(--r-lg);background:var(--c-surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:var(--sp-4)}
.dialog .box p{margin:0}

/* Toast */
.toast{
  position:fixed;z-index:40;left:50%;transform:translateX(-50%);
  bottom:calc(var(--sab) + 92px);
  width:min(420px,calc(100% - 32px));
  display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4);
  border-radius:var(--r-pill);background:var(--c-text);color:#fff;box-shadow:var(--shadow);
  font-size:var(--fs-sm);font-weight:600;
}
.toast[hidden]{display:none}
.toast span{flex:1}
.toast button{height:var(--tap);padding:0 var(--sp-4);color:#c7b8ff;font-weight:800}

.badge-demo{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.65);font-size:.625rem;font-weight:500;margin-top:var(--sp-2)}


/* ===== Mockup telefonu: jen na širší obrazovce. Na telefonu běží apka na celou plochu. ===== */
.statusbar,.island,.homebar{display:none}
@media (min-width:600px) and (min-height:640px){
  html,body{height:auto;min-height:100%}
  body{background:var(--device-bg);overflow:auto}
  .stage{min-height:100vh;display:grid;place-items:center;padding:32px 16px;
    background:none}
  .device{width:390px;height:min(844px,calc(100vh - 64px));padding:12px;border-radius:62px;background:var(--device-frame);
    box-shadow:inset 0 0 0 2px #3b3160,0 0 0 10px color-mix(in srgb,var(--device-ring) 45%,transparent),0 30px 60px rgba(20,16,40,.22)}
  .screen{position:relative;height:100%;border-radius:50px;overflow:hidden;background:var(--c-bg);transform:translateZ(0);--sat:50px;--sab:22px}
  .scroller{height:100%;overflow-y:auto;scrollbar-width:none}
  .scroller::-webkit-scrollbar{display:none}
  .statusbar{display:flex;position:absolute;z-index:50;top:0;left:0;right:0;height:50px;padding:4px 30px 0 34px;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;color:#fff;pointer-events:none}
  .statusbar .sys{display:flex;gap:6px;align-items:center}
  .statusbar svg{height:12px;width:auto;fill:currentColor}
  .island{display:block;position:absolute;z-index:51;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000}
  .homebar{display:block;position:absolute;z-index:60;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--c-text);opacity:.85;pointer-events:none}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

// Migrace: každá funkce převede data z verze N na N+1. Data uživatele se nikdy nemažou.
const MIGRATIONS = {
  // v1 -> v2: kategorie mohou mít podskupiny (např. místnosti). Nic se nemaže.
  1: d => {
    d.areas.forEach(a => { if (!Array.isArray(a.groups)) a.groups = []; });
    if (d.demo) {
      const home = d.areas.find(a => a.id === "home");
      if (home && !home.groups.length) {
        home.groups = [{ id: "g-living", name: "Obývák" }, { id: "g-kitchen", name: "Kuchyň" }, { id: "g-bedroom", name: "Ložnice" }];
        d.tasks.forEach(x => { if (x.areaId === "home" && /povlečení|šatník/i.test(x.title)) x.groupId = "g-bedroom"; });
      }
    }
    d.version = 2; return d;
  },
};
function migrate(d) {
  if (!d || typeof d !== "object" || typeof d.version !== "number") throw new Error("invalid");
  let data = d;
  while (data.version < DATA_VERSION) {
    const step = MIGRATIONS[data.version];
    if (!step) throw new Error("no-migration");
    data = step(data);
  }
  if (!Array.isArray(data.areas) || !Array.isArray(data.tasks) || !Array.isArray(data.habits) || !Array.isArray(data.inbox)) throw new Error("invalid");
  data.meta = data.meta || { lastBackup: null, reviewWeekday: 0 };
  return data;
}

function weekStart(d = day()) { const x = new Date(d); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }
function weekDaysISO() { const s = weekStart(); const today = todayISO(); const out = []; for (let i = 0; i < 7; i++) { const k = iso(day(i, s)); if (k > today) break; out.push(k); } return out; }

function habitDoneToday(h) { return !!h.log[todayISO()]; }
function habitStreak(h) {
  let n = 0; let i = habitDoneToday(h) ? 0 : 1;
  while (h.log[iso(day(-i))]) { n++; i++; }
  return n;
}
function habitWeekCount(h) { return weekDaysISO().filter(k => h.log[k]).length; }
function habitIsDueToday(h) { return h.freq.type === "daily" || habitDoneToday(h) || habitWeekCount(h) < h.freq.times; }
function habitProgress(h) {
  if (h.freq.type === "daily") return habitDoneToday(h) ? 1 : 0;
  return Math.min(1, habitWeekCount(h) / h.freq.times);
}

function taskIsOpen(task) {

function last7() {
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const k = iso(day(-i));
    const tasks = state.tasks.filter(x => x.doneAt === k).length + state.tasks.reduce((s, x) => s + (x.subtasks || []).filter(st => st.doneAt === k).length, 0);
    const habits = state.habits.filter(h => h.log[k]).length;
    out.push({ k, d: day(-i), v: tasks + habits });
  }
  return out;
}
function weekStats() {
  const days = weekDaysISO();
  const tasksDone = state.tasks.filter(x => x.doneAt && days.includes(x.doneAt)).length;
  let target = 0, got = 0;
  state.habits.forEach(h => {
    if (h.freq.type === "daily") { target += days.length; got += days.filter(k => h.log[k]).length; }
    else { target += h.freq.times; got += Math.min(h.freq.times, habitWeekCount(h)); }
  });
  return { tasksDone, rate: target ? Math.round((got / target) * 100) : 0 };
}

  return () => { if (was) h.log[k] = true; else delete h.log[k]; save(); };

  const done = mine.filter(x => x.type !== "recurring" && !taskIsOpen(x)).sort((a, b) => (b.doneAt || "").localeCompare(a.doneAt || ""));

function renderTask(task, mode = "full") {

  const skipTag = (mode === "area" && isSkippedToday(task) ? `<span class="pill p3">${t().skipped}</span>` : "")

  const editBtn = canEdit ? `<button class="icon-btn-plain" data-action="task-edit" data-id="${task.id}" aria-label="${t().editTask}: ${esc(task.title)}">${icon("pencil")}</button>` : "";
  const fmtDay = d => new Intl.DateTimeFormat(lang, { day: "numeric", month: "long" }).format(new Date(d + "T12:00:00"));
  if (task.type === "project") {
    const { d, n } = projectProgress(task); const open = expanded.has(task.id);
    return `<div class="row ${n && d === n ? "is-done" : ""}" data-row="${task.id}">

        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${d}"><i style="width:${n ? (d / n) * 100 : 0}%"></i></div>
      </div>
      ${skipBtn}${editBtn}
      <button class="expand" data-action="expand" data-id="${task.id}" aria-expanded="${open}" aria-label="${t().showSteps}">${icon("chevron")}</button>
    </div>
    ${open ? `<div class="subtasks">${task.subtasks.map(st => `
      <div class="subtask ${st.done ? "is-done" : ""}">
        <button class="check" role="checkbox" aria-checked="${st.done}" data-action="sub" data-id="${task.id}" data-sub="${st.id}" aria-label="${esc(st.title)}"><span>${icon("check")}</span></button>
        <span class="label">${esc(st.title)}</span>
      </div>`).join("")}</div>` : ""}`;
  }
  let extra = "";

    extra = `<span style="display:inline-flex;align-items:center;gap:4px">${icon("repeat", "icon")}${waiting ? t().nextDue(fmtDay(task.nextDue)) : t().recurring(task.everyDays)}</span>`;

// Úkoly rozdělené podle podskupin kategorie (např. místností). extra = řádky navíc do „Ostatní“.
function renderByGroups(area, items, mode, extra = "") {
  const all = area.groups || [];
  const known = new Set(all.map(g => g.id));
  const otherG = all.find(g => g.name.trim().toLowerCase() === t().otherGroup.toLowerCase());
  const inGroup = (x, g) => x.groupId === g.id || (otherG && g.id === otherG.id && (!x.groupId || !known.has(x.groupId)));
  const groups = all.filter(g => items.some(x => inGroup(x, g)) || (otherG && g.id === otherG.id && extra));
  if (!groups.length) return items.map(x => renderTask(x, mode)).join("") + extra;
  const rest = otherG ? [] : items.filter(x => !x.groupId || !known.has(x.groupId));
  return groups.map(g => `<div class="subhead">${esc(g.name)}</div>${items.filter(x => inGroup(x, g)).map(x => renderTask(x, mode)).join("")}${otherG && g.id === otherG.id ? extra : ""}`).join("")
    + (!otherG && (rest.length || extra) ? `<div class="subhead">${t().otherGroup}</div>${rest.map(x => renderTask(x, mode)).join("")}${extra}` : "");
}

function renderChart() {
  const data = last7(); const max = Math.max(4, ...data.map(d => d.v));
  const W = 320, H = 110, padB = 18, padT = 14, bw = 26, gap = (W - bw * 7) / 6;
  const fmt = new Intl.DateTimeFormat(lang, { weekday: "short" });
  const grid = [0.5, 1].map(f => { const y = padT + (H - padB - padT) * (1 - f); return `<line class="grid" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`; }).join("");
  const bars = data.map((d, i) => {
    const h = Math.max(3, (H - padB - padT) * (d.v / max)); const x = i * (bw + gap); const y = H - padB - h; const isToday = i === 6;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="7" ${isToday ? 'fill="url(#gt)"' : 'class="bar"'}/>
      ${isToday ? `<text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" class="today-l">${d.v}</text>` : ""}
      <text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle" class="${isToday ? "today-l" : ""}">${fmt.format(d.d).replace(".", "")}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t().chartLabel}">
    <defs><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8455d6"/><stop offset="1" stop-color="#7342cb"/></linearGradient></defs>
    ${grid}${bars}</svg>`;
}

function render() {
  document.documentElement.lang = lang;
  const v = view(); const key = v.name + (v.id || "");
  const now = new Date(); const hr = now.getHours();
  const greet = t().greet[hr < 11 ? 0 : hr < 18 ? 1 : 2];
  const date = new Intl.DateTimeFormat(lang, { weekday: "long", day: "numeric", month: "long" }).format(now).replace(/^./, c => c.toUpperCase());

  let top, body, capture = "";
  if (v.name === "inbox") { top = topBlock(date, t().inboxTitle); body = renderInboxBody(); }
  else if (v.name === "areas") { top = topBlock(date, t().areasTitle); body = renderAreasBody(); }
  else if (v.name === "area") {
    const a = areaById(v.id);
    top = topBlock(t().areaLabel, a.name, { back: "areas", right: `<button class="icon-btn" data-action="area-edit" data-id="${a.id}" aria-label="${t().editArea}">${icon("pencil")}</button>` });
    body = renderAreaBody(a);
  }
  else if (v.name === "habits") { top = topBlock(date, t().habitsTitle); body = renderHabitsBody(); }
  else { top = topBlock(greet, date); body = renderHomeBody(); }

  document.getElementById("app").innerHTML = `<section class="hero">${top}${capture}</section>` + body;
  if (key !== lastViewKey) {
    lastViewKey = key; archiveOpen = false;
    const sc = document.querySelector(".scroller"); if (sc && sc.scrollTo) sc.scrollTo(0, 0);
    window.scrollTo(0, 0);
  }

  const cur = v.name === "area" ? "areas" : v.name;
  const tabs = [["home", "home2"], ["areas", "grid"], ["habits", "repeat"], ["inbox", "inbox"]];
  document.getElementById("tabbar").innerHTML = tabs.map(([k, ic]) => `
    <button class="tab" ${cur === k ? 'aria-current="page"' : ""} data-action="nav" data-view="${k}">
      ${icon(ic)}${k === "inbox" && state.inbox.length ? `<span class="badge">${state.inbox.length}</span>` : ""}<span>${t().tabs[k]}</span>

  document.getElementById("tabbar").setAttribute("aria-label", t().tabs.home);

  if (!storage.ok) toast(t().storageOff);
}

function submitForm(form) {
  const f = new FormData(form); const id = form.dataset.id;
  const title = (f.get("title") || f.get("name") || "").toString().trim();
  if (!title) { toast(t().required); const inp = form.querySelector('[name="title"],[name="name"]'); if (inp) inp.focus(); return; }
  if (form.dataset.form !== "area" && !f.get("area")) { toast(t().needArea); return; }
  const snap = snapshot();
  if (form.dataset.form === "task") {
    const type = f.get("type"); const priority = +f.get("priority") || 2;
    let task = id ? state.tasks.find(x => x.id === id) : null;
    if (!task) { task = { id: uid(), done: false }; state.tasks.push(task); }
    Object.assign(task, { title, areaId: f.get("area"), priority, type });
    const fu = (f.get("followUp") || "").toString().split("\n").map(x => x.trim()).filter(Boolean).join("\n"); if (fu) task.followUp = fu; else delete task.followUp;
    const gsel = (f.get("group_" + task.areaId) || "").toString(); const ar = areaById(task.areaId);
    if (gsel && ar && (ar.groups || []).some(g => g.id === gsel)) task.groupId = gsel; else delete task.groupId;
    if (type === "project") {
      const old = task.subtasks || [];
      const lines = f.get("steps").toString().split("\n").map(x => x.trim()).filter(Boolean);
      task.subtasks = lines.map(l => { const m = old.find(o => o.title === l); return m || { id: uid(), title: l, done: false }; });
      delete task.everyDays; delete task.nextDue;
    } else if (type === "recurring") {
      task.everyDays = Math.max(1, Math.min(365, +f.get("every") || 7));
      if (!task.nextDue) task.nextDue = todayISO();
      task.done = false; delete task.subtasks;
    } else { delete task.subtasks; delete task.everyDays; delete task.nextDue; }
  } else if (form.dataset.form === "habit") {
    let h = id ? state.habits.find(x => x.id === id) : null;
    if (!h) { h = { id: uid(), log: {} }; state.habits.push(h); }
    h.title = title; h.areaId = f.get("area");
    h.freq = f.get("freq") === "weekly" ? { type: "weekly", times: +f.get("times") || 3 } : { type: "daily" };
  } else if (form.dataset.form === "area") {
    let a = id ? areaById(id) : null; const isNew = !a;
    if (!a) { a = { id: uid() }; state.areas.push(a); }
    Object.assign(a, { name: title, icon: f.get("icon") || "other", color: f.get("color") || PALETTE[0],
      direction: f.get("direction").toString().trim(), context: f.get("context").toString().trim() });
    const oldG = a.groups || [];
    const names = (f.get("groups") || "").toString().split("\n").map(x => x.trim()).filter(Boolean);
    a.groups = [...new Set(names)].map(n => oldG.find(g => g.name === n) || { id: uid(), name: n });
    const keep = new Set(a.groups.map(g => g.id));
    state.tasks.forEach(x => { if (x.areaId === a.id && x.groupId && !keep.has(x.groupId)) delete x.groupId; });
    save(); closeSheet();
    if (isNew) go("area-" + a.id); else render();
    toast(t().saved, restore(snap));
    return;
  }
  save(); closeSheet(); render(); toast(t().saved, restore(snap));
}

const dialogEl = document.getElementById("dialog");
function confirmDialog(text, okLabel, onOk) {
  dialogEl.innerHTML = `<div class="box"><p>${text}</p><div class="btn-row" style="justify-content:flex-end">
    <button class="btn" data-d="cancel">${t().cancel}</button><button class="btn danger" data-d="ok">${okLabel}</button></div></div>`;
  dialogEl.hidden = false; dialogEl.querySelector('[data-d="cancel"]').focus();
  dialogEl.onclick = e => { const b = e.target.closest("[data-d]"); if (!b && e.target !== dialogEl) return; dialogEl.hidden = true; if (b && b.dataset.d === "ok") onOk(); };
}
const toastEl = document.getElementById("toast"); let toastTimer;
function toast(text, undoFn) {
  clearTimeout(toastTimer);
  toastEl.innerHTML = `<span>${text}</span>${undoFn ? `<button data-t="undo">${t().undo}</button>` : ""}`;
  toastEl.hidden = false;
  toastEl.onclick = e => { if (e.target.closest('[data-t="undo"]')) { undoFn(); rerender(); toast(t().undone); } };
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, undoFn ? 5000 : 3000);
}
function rerender() { render(); }

/* ----- Události ----- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-action]"); if (!el) { if (e.target === sheetEl) closeSheet(); return; }
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case "habit": { const u = toggleHabit(id); rerender(); if (state.habits.find(h => h.id === id).log[todayISO()]) toast(t().done, u); break; }
    case "task": { const u = completeTask(id); rerender(); const f = completeTask.lastFollow; toast(f ? t().followAdded(f.title) : t().done, u); break; }
    case "sub": { const u = toggleSubtask(id, el.dataset.sub); rerender(); toast(t().done, u); break; }
    case "expand": expanded.has(id) ? expanded.delete(id) : expanded.add(id); rerender(); break;
    case "expand-area": expandedAreas.has(id) ? expandedAreas.delete(id) : expandedAreas.add(id); rerender(); break;
    case "area": go("area-" + id); break;
    case "area-new": openAreaForm(); break;
    case "area-edit": openAreaForm(id); break;
    case "quick-add": openQuickAdd(); break;
    case "quick-detail": {
      const v = (document.getElementById("quick-input") || {}).value || "";
      openTaskForm(null, view().name === "area" ? view().id : undefined);
      const ti = sheetEl.querySelector('[name="title"]'); if (ti) ti.value = v.trim();
      break;
    }
    case "gchip-add": gchipsAdd(el.closest("form")); break;
    case "gchip-del": { const form = el.closest("form"); const names = form.querySelector('[name="groups"]').value.split("\n").filter(Boolean).filter(n => n !== el.dataset.name); gchipsUpdate(form, names); break; }
    case "groups-edit": { openAreaForm(id); const g = sheetEl.querySelector("#gchip-input"); if (g) { g.scrollIntoView({ block: "center" }); g.focus(); } break; }
    case "area-delete": {
      const a = areaById(id); const n = state.tasks.filter(x => x.areaId === id).length + state.habits.filter(h => h.areaId === id).length;
      confirmDialog(esc(t().deleteAreaConfirm(a.name, n)), t().deleteLabel, () => { const u = deleteArea(id); closeSheet(); go("areas"); toast(t().deletedArea, () => { u(); }); });
      break;
    }
    case "task-new": openTaskForm(null, el.dataset.area); break;
    case "task-edit": openTaskForm(id); break;
    case "task-delete": { const u = deleteTask(id); closeSheet(); render(); toast(t().deleted, u); break; }
    case "habit-new": openHabitForm(null, el.dataset.area); break;
    case "habit-edit": openHabitForm(id); break;
    case "habit-delete": { const u = deleteHabit(id); closeSheet(); render(); toast(t().deleted, u); break; }
    case "habit-day": { const u = toggleHabitDay(id, el.dataset.day); render(); if (state.habits.find(h => h.id === id).log[el.dataset.day]) toast(t().done, u); break; }
    case "skip": { const u = skipToday(id); render(); toast(t().skippedToast, u); break; }
    case "archive": archiveOpen = !archiveOpen; render(); break;
    case "start-own": confirmDialog(t().startOwnConfirm, t().startOwnOk, () => { startOwnData(); closeSheet(); go(""); toast(t().startOwnDone); }); break;
    case "settings": openSettings(); break;
    case "close": closeSheet(); break;
    case "soon": toast(t().soon); break;
    case "nav": { const v = el.dataset.view; go(v === "home" ? "" : v); break; }
    case "inbox-delete": { const u = deleteInbox(id); render(); toast(t().deleted, u); break; }
    case "inbox-sort": openSort(id); break;
    case "sort-area": sortChoice.areaId = el.dataset.area; openSort(sortChoice.id); break;
    case "sort-prio": sortChoice.priority = +el.dataset.prio; openSort(sortChoice.id); break;
    case "sort-confirm": { const a = areaById(sortChoice.areaId); const u = sortInbox(sortChoice.id, sortChoice.areaId, sortChoice.priority); closeSheet(); render(); toast(t().sortedTo(a.name), u); break; }
    case "lang": lang = el.dataset.lang; prefs.lang = lang; savePrefs(); render(); openSettings(); break;
    case "copy": {
      const json = exportBackup();
      document.getElementById("lb").textContent = new Intl.DateTimeFormat(lang, { dateStyle: "medium", timeStyle: "short" }).format(new Date(state.meta.lastBackup));
      try { await navigator.clipboard.writeText(json); toast(t().copied); }
      catch (err) { const d = document.getElementById("dump"); d.hidden = false; d.value = json; d.select(); toast(t().copyFailed); }
      break;
    }
    case "reset": confirmDialog(t().resetConfirm, t().replace, () => { state = sampleData(); save(); closeSheet(); render(); }); break;
  }
});
document.addEventListener("change", e => {
  const form = e.target.closest("form[data-form]"); if (!form) return;
  if (e.target.name === "type") form.dataset.type = e.target.value;
  if (e.target.name === "area") form.querySelectorAll(".f-group").forEach(el => { el.hidden = el.dataset.forArea !== e.target.value; });
  if (e.target.name === "freq") form.dataset.freq = e.target.value;
});
document.addEventListener("submit", e => {
  const form = e.target.closest("form[data-form]");
  if (form) { e.preventDefault(); submitForm(form); return; }
  if (e.target.id === "quick-form") {
    e.preventDefault();
    const inp = document.getElementById("quick-input"); const text = inp.value.trim();
    if (!text) { toast(t().emptyCapture); inp.focus(); return; }
    const u = addInbox(text); closeSheet(); render(); toast(t().added, u); return;
  }
  if (e.target.id !== "capture") return;
  e.preventDefault();
  const input = document.getElementById("capture-input"); const text = input.value.trim();
  if (!text) { toast(t().emptyCapture); input.focus(); return; }
  const u = addInbox(text); render(); toast(t().added, u);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "gchip-input") { e.preventDefault(); gchipsAdd(e.target.closest("form")); return; }
  if (e.key === "Escape") { if (!dialogEl.hidden) dialogEl.hidden = true; else if (!sheetEl.hidden) closeSheet(); }
});

window.addEventListener("hashchange", render);
// Offline: service worker (jen když ho prostředí dovolí, v náhledu artefaktu se tiše přeskočí)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) { /* bez offline režimu */ }
}
load();
render();
{ const c = document.getElementById("clock"); const n = new Date(); c.textContent = `${n.getHours()}:${String(n.getMinutes()).padStart(2, "0")}`; }
</script>
</body>
