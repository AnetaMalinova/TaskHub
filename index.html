<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7342cb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TaskHub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TaskHub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<!-- Písmo Plus Jakarta Sans: SIL Open Font License 1.1 (komerční použití povoleno). V nativní verzi bude přibalené kvůli offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== TOKENY =====
   Layout: jeden sloupec pro palec. Fialová hlavička s rychlým zápisem, pak návyky, priority, oblasti, týden.
   Vizuální svět: světlá levandule, bílé karty, jedna sytá fialová, navigace jako pilulka. */
:root{
  color-scheme: light;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  /* Spodní lišta: na iPhonu zasahuje do zóny home indikátoru (jako nativní plovoucí lišty), jinde 12 px od kraje. */
  --tabbar-bottom:max(12px, calc(var(--sab) - 14px));
  --device-bg:#ecebf0;
  --device-frame:#1c1633;
  --device-ring:#d9d7e0;
  --c-bg:#f2effa;
  --c-surface:#ffffff;
  --c-surface-2:#f7f4fd;
  --c-text:#1c1633;
  --c-muted:#6b6489;
  --c-faint:#726a9d;
  --c-accent:#7342cb;
  --c-skip:#f5c48f;
  --c-accent-2:#8455d6;
  --c-accent-soft:#ece5f8;
  --c-on-accent:#ffffff;
  --c-stroke:#e6e0f3;
  --c-good:#2f9470;
  --c-warn:#95600a;
  --c-crit:#c52e61;

  --f-display:"Plus Jakarta Sans", -apple-system, "SF Pro Display", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", -apple-system, "SF Pro Text", system-ui, sans-serif;

  --fs-xs:.75rem; --fs-sm:.8125rem; --fs-md:.9375rem; --fs-lg:1.125rem; --fs-xl:1.5rem; --fs-xxl:1.75rem;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  --r-sm:12px; --r-md:16px; --r-lg:24px; --r-xl:30px; --r-pill:999px;
  --tap:44px;
  --shadow:0 8px 24px rgba(115,66,203,.08), 0 1px 2px rgba(115,66,203,.06);
  --shadow-accent:0 10px 24px rgba(115,66,203,.32);
  --t-fast:160ms;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
button,input,textarea,select{font-variant-ligatures:no-common-ligatures}
body{font-variant-ligatures:no-common-ligatures;
  background:var(--c-bg);
  color:var(--c-text);
  font-family:var(--f-body);
  font-size:var(--fs-md);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg span{position:absolute;border-radius:50%;filter:blur(80px)}
.bg .b1{width:360px;height:360px;background:#ddd0f5;top:-120px;right:-140px;opacity:.7}
.bg .b2{width:300px;height:300px;background:#f6d9f3;top:55%;left:-160px;opacity:.55}
.bg .b3{display:none}

.app{
  position:relative;z-index:1;
  max-width:480px;margin:0 auto;
  padding:0 var(--sp-4) calc(var(--tabbar-bottom) + 96px);
  display:flex;flex-direction:column;gap:var(--sp-6);
}

.glass{
  background:var(--c-surface);
  border:1px solid var(--c-stroke);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,.area:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Fialová hlavička */
.hero{
  background:var(--c-accent);
  color:var(--c-on-accent);
  margin:0 calc(-1 * var(--sp-4));
  border-radius:0 0 var(--r-xl) var(--r-xl);
  padding:calc(var(--sat) + var(--sp-8)) var(--sp-5) var(--sp-5);
  display:flex;flex-direction:column;gap:var(--sp-4);
  box-shadow:var(--shadow-accent);
  position:relative;overflow:hidden;
}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);position:relative;z-index:1}
.top h1{font-family:var(--f-display);font-size:var(--fs-xl);line-height:1.2;font-weight:700;letter-spacing:-.01em;word-spacing:.12em;margin:0;text-wrap:balance}
.top .greet{font-size:var(--fs-sm);font-weight:500;color:rgba(255,255,255,.84);margin-bottom:4px}
.icon-btn{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:var(--r-md);background:none;color:#fff;margin-right:-10px}
.icon-btn .icon{width:24px;height:24px}
.icon-btn.icon-btn-subtle{margin-top:-12px;opacity:.7}
.icon-btn-subtle .icon{width:19px;height:19px}

/* Rychlý zápis */
.capture{display:flex;align-items:center;gap:var(--sp-2);padding:4px 4px 4px var(--sp-4);background:#fff;border-radius:var(--r-pill);position:relative;z-index:1}
.capture input{flex:1;min-width:0;height:var(--tap);background:none;border:0;color:var(--c-text);font:inherit;font-size:1rem;font-weight:400}
.capture input::placeholder{color:var(--c-faint);font-weight:400}
.capture input:focus{outline:none}
.capture:focus-within{box-shadow:0 0 0 3px rgba(255,255,255,.4)}
.btn-accent{
  height:var(--tap);min-width:var(--tap);padding:0 var(--sp-3);border-radius:var(--r-pill);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  background:var(--c-accent);color:#fff;font-weight:700;
}
.capture-meta{display:flex;justify-content:space-between;font-size:var(--fs-sm);font-weight:400;color:rgba(255,255,255,.85);padding:0 var(--sp-2);position:relative;z-index:1}

.link-u{color:rgba(255,255,255,.62);font-size:var(--fs-xs);font-weight:400;text-decoration:underline;text-decoration-color:rgba(255,255,255,.3);text-decoration-thickness:1px;text-underline-offset:3px;min-height:var(--tap);margin:-14px 0;display:inline-flex;align-items:center}
.link-pill{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 6px 0 12px;margin:-6px 0;border-radius:var(--r-pill);background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:var(--fs-xs);position:relative}
.link-pill::after{content:"";position:absolute;inset:-6px 0}
.link-pill .icon{width:16px;height:16px}
.lead{margin:0;padding:0 var(--sp-1);color:var(--c-muted);font-size:var(--fs-sm)}
.inbox-row{gap:var(--sp-1);padding-right:var(--sp-3)}
.icon-btn-plain{width:var(--tap);height:var(--tap);display:grid;place-items:center;color:var(--c-faint);border-radius:var(--r-md);flex:none}
.btn-sort{height:36px;padding:0 var(--sp-4);border-radius:var(--r-pill);background:var(--c-accent-soft);color:var(--c-accent);font-weight:700;font-size:var(--fs-sm);flex:none;position:relative}
.btn-sort::after{content:"";position:absolute;inset:-4px 0}
.area-pick{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.pick{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 6px;border-radius:var(--r-pill);background:var(--c-surface);border:1.5px solid var(--c-stroke);font-weight:600;font-size:var(--fs-sm);text-align:left;position:relative}
.pick::after{content:"";position:absolute;inset:-4px 0}
.pick .ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--area-c) 14%,#fff);color:var(--area-c);flex:none}
.pick .ico .icon{width:15px;height:15px}
.pick[aria-checked="true"]{border-color:var(--c-accent);background:var(--c-accent-soft)}
.btn-wide{width:100%;height:52px;font-size:var(--fs-md)}
.btn-accent:disabled{opacity:.4;cursor:default}

/* Sekce */
.section{display:flex;flex-direction:column;gap:var(--sp-3)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2);padding:0 var(--sp-1)}
.section-head h2{font-family:var(--f-display);font-size:var(--fs-lg);font-weight:800;margin:0;letter-spacing:-.01em}
.section-head .meta{color:var(--c-muted);font-size:var(--fs-sm);font-weight:600;font-variant-numeric:tabular-nums}

/* Návyky */
.habits{display:flex;gap:var(--sp-3);overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 14px;margin:-4px -4px -10px;scrollbar-width:none}
.habits::-webkit-scrollbar{display:none}
.habit{
  flex:0 0 136px;scroll-snap-align:start;padding:var(--sp-4) var(--sp-3);
  display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-3);text-align:left;
  transition:transform var(--t-fast),background var(--t-fast);
}
.habit:active{transform:scale(.97)}
.habit.is-done{background:var(--c-accent);border-color:var(--c-accent);color:#fff;box-shadow:var(--shadow-accent)}
.ring{position:relative;width:44px;height:44px}
.ring svg{width:44px;height:44px;transform:rotate(-90deg)}
.ring .track{stroke:var(--c-accent-soft)}
.habit.is-done .ring .track{stroke:rgba(255,255,255,.25)}
.ring .val{transition:stroke-dashoffset 400ms ease}
.ring .mark{position:absolute;inset:0;display:grid;place-items:center}
.habit .name{font-weight:700;font-size:var(--fs-md);line-height:1.25}
.habit .sub{display:flex;align-items:center;gap:var(--sp-1);color:var(--c-muted);font-size:var(--fs-xs);font-weight:600;font-variant-numeric:tabular-nums}
.habit .sub .icon{width:14px;height:14px}
.habit.is-done .sub{color:rgba(255,255,255,.85)}

/* Priority */
.list{padding:0;overflow:hidden}
.list:has(> .subhead:first-child){padding-top:0}
.row{display:flex;align-items:center;gap:var(--sp-3);min-height:62px;padding:var(--sp-2) var(--sp-4);position:relative}
.row + .row::before,.swipe + .swipe > .row::before,.row + .swipe > .row::before,.swipe + .row::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--c-stroke)}
/* Swajp doleva odkryje akce (Dnes ne, Cíl dne). */
.swipe{position:relative;overflow:hidden}
[data-drag]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* Apka se ovládá dotykem: dlouhé podržení nesmí označovat text (kromě polí formuláře). */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* Přetahovaná položka: zvednutá, sleduje prst; ostatní ztlumené. */
.drag-on{position:relative;z-index:30;box-shadow:0 18px 40px rgba(40,20,90,.28),0 0 0 2px var(--c-accent);background:var(--c-surface);transition:box-shadow .15s ease;pointer-events:none;animation:lift .18s ease-out}
@keyframes lift{from{opacity:.85}to{opacity:1}}
.drag-list > :not(.drag-on){opacity:.55;transition:opacity .15s ease}
/* V seznamech: zvednutý řádek bez dělicí linky, se zaoblenými rohy. */
.drag-on::before,.drag-on > .row::before{display:none !important}
.list .drag-on{border-radius:var(--r-lg);overflow:hidden;box-shadow:0 12px 28px rgba(40,20,90,.25)}
/* Fialový rámeček uvnitř řádku, aby ho neořízl okraj karty. */
.list .drag-on > .row,.list .row.drag-on{box-shadow:inset 0 0 0 2px var(--c-accent);border-radius:var(--r-lg)}
.drag-on + .swipe > .row::before,.drag-on + .row::before{display:none}
@media (prefers-reduced-motion:reduce){.drag-on{animation:none}}
.drag-on > .row{background:var(--c-surface)}
.wdots{display:flex;gap:4px;flex:none}
.row-right{flex:none;display:inline-flex}
.tags .meta.due-soon{color:var(--c-crit);font-weight:600}
.tags .meta + .meta::before{content:"·";margin-right:var(--sp-2);color:var(--c-faint);font-weight:500}
.rep-badge{display:inline-flex;align-items:center;gap:4px;flex:none;font-size:.6875rem;font-weight:600;color:var(--c-faint)}
.rep-badge .icon{width:13px;height:13px}
.rep-badge.due-soon{color:var(--c-crit)}
.tags .meta{color:var(--c-faint);font-weight:500;font-size:.6875rem}
.row .body:has(.meta){gap:1px}
.done-link{align-self:flex-end;min-height:36px;margin:-10px calc(-1 * var(--sp-2)) -8px 0;padding:0 var(--sp-2);font-size:var(--fs-xs);font-weight:500;color:var(--c-muted);text-decoration:underline;text-decoration-color:var(--c-stroke);text-underline-offset:3px;position:relative}
.done-link::after{content:"";position:absolute;inset:-4px 0}
.wdots i{width:10px;height:10px;border-radius:3px;background:var(--c-stroke)}
.wdots i.on{background:var(--area-c)}
.swipe > .row{background:var(--c-surface);touch-action:pan-y;transition:transform .22s ease;will-change:transform}
.swipe.dragging > .row{transition:none}
.swipe.open > .row{transform:translateX(calc(-1 * var(--sw-w)))}
.sw-acts{position:absolute;top:0;right:0;bottom:0;display:flex}
.sw-act{width:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:.6875rem;font-weight:700}
.sw-act .icon{width:20px;height:20px}
.sw-skip{background:var(--c-skip);color:var(--c-text)}
.sw-goal{background:var(--c-accent)}
.sw-goal .t-core{fill:currentColor}
.sw-goal.on{background:var(--c-muted)}
@media (prefers-reduced-motion:reduce){.swipe > .row{transition:none}}
.row.no-check::before{left:var(--sp-4) !important}
.row .stripe{position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0}
.check{width:var(--tap);height:var(--tap);margin:-6px -6px -6px -10px;flex:none;display:grid;place-items:center}
.check span{width:24px;height:24px;border-radius:8px;border:2px solid #d3c8ec;display:grid;place-items:center;transition:all var(--t-fast);background:#fff}
.check[aria-checked="true"] span{background:var(--c-accent);border-color:var(--c-accent)}
.check .icon{width:14px;height:14px;stroke-width:3;opacity:0;stroke:#fff}
.check[aria-checked="true"] .icon{opacity:1}
.proj-ico{width:24px;height:24px;flex:none;display:grid;place-items:center}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .title{font-weight:600;overflow-wrap:anywhere}
.title-link{text-align:left;padding:4px 0;margin:-4px 0;cursor:pointer}
.title-link:active{color:var(--c-accent)}
.row.is-done .title{color:var(--c-faint);text-decoration:line-through}
.row .tags{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);font-size:var(--fs-xs);color:var(--c-muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:var(--r-pill);font-size:.6875rem;font-weight:700}
.pill.p1{background:#fde7ef;color:var(--c-crit)}
.pill.p2{background:#fdf1d8;color:var(--c-warn)}
.pill.p3{background:var(--c-surface-2);color:var(--c-muted);box-shadow:inset 0 0 0 1px var(--c-stroke)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.progress{height:6px;border-radius:var(--r-pill);background:var(--c-accent-soft);overflow:hidden;margin-top:4px}
.progress i{display:block;height:100%;border-radius:inherit;background:var(--c-accent)}
.expand{width:var(--tap);height:var(--tap);display:grid;place-items:center;margin-right:-10px;color:var(--c-muted);flex:none}
.expand .icon{transition:transform var(--t-fast)}
.expand[aria-expanded="true"] .icon{transform:rotate(180deg)}
.subtasks{padding:0 var(--sp-4) var(--sp-3) 54px;display:flex;flex-direction:column}
.subtask{display:flex;align-items:center;gap:var(--sp-2);min-height:var(--tap);font-size:var(--fs-sm);font-weight:500}
.subtask .check{margin:0 0 0 -10px}
.subtask .check span{width:20px;height:20px;border-radius:6px}
.subtask.is-done .label{color:var(--c-faint);text-decoration:line-through}
.empty{padding:var(--sp-6) var(--sp-4);text-align:center;color:var(--c-muted);font-size:var(--fs-sm)}

/* Činnosti pro dnešek: skupiny podle oblastí */
.groups{display:flex;flex-direction:column;gap:var(--sp-2)}
.group{overflow:hidden;border-radius:var(--r-md)}
.group-head{width:100%;display:flex;align-items:center;gap:var(--sp-3);min-height:60px;padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-3);text-align:left}
.group-head .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--area-c) 14%,#fff);color:var(--area-c);flex:none}
.g-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.g-name{font-weight:700}
.g-row{flex-direction:row;align-items:center;gap:var(--sp-2)}
.g-count{min-width:22px;height:22px;padding:0 7px;border-radius:var(--r-pill);background:var(--c-accent-soft);color:var(--c-accent);font-size:var(--fs-xs);font-weight:800;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.g-count.zero{background:#e3f6ee;color:var(--c-good)}
.g-count .icon{width:12px;height:12px;stroke-width:3}
.g-meta{font-size:var(--fs-xs);color:var(--c-muted);font-weight:500;display:flex;align-items:center;gap:4px}
.g-chev{width:32px;height:32px;display:grid;place-items:center;color:var(--c-muted)}
.g-chev .icon{transition:transform var(--t-fast)}
.group.is-open .g-chev .icon{transform:rotate(180deg)}
.group-list{border-top:1px solid var(--c-stroke)}
.group-list .row{padding-left:var(--sp-4)}

/* Hlavička: text vedle tlačítek */
.top-txt{flex:1;min-width:0}
.top-txt h1{overflow-wrap:anywhere}

/* Detail oblasti */
.dir-block{border-left:4px solid var(--area-c)}
.dir-block h4{color:var(--area-c)}
.add-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-2);border:2px dashed #d3c8ec;border-radius:var(--r-lg);background:transparent;color:var(--c-accent);font-weight:700;min-height:156px}
.add-tile .icon{width:28px;height:28px}

/* Karty návyků */
.hcards{display:flex;flex-direction:column;gap:var(--sp-3)}
.hcard{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3)}
.hc-head{display:flex;align-items:center;gap:var(--sp-3)}
.hc-head .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--area-c) 14%,#fff);color:var(--area-c);flex:none}
.hc-head .icon-btn-plain{align-self:flex-start;margin:-10px -10px 0 0}
.hc-txt{flex:1;min-width:0}
.hc-name{font-weight:700}
.hc-meta{font-size:var(--fs-xs);color:var(--c-muted)}
.hc-weeks{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hc-weeks::-webkit-scrollbar{display:none}
.hc-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:0 0 100%;scroll-snap-align:start}
.hc-day:disabled{cursor:default}
/* Nesplněné dny (minulé i budoucí) stejně bledé; dnešek a splněné dny plně. */
.hc-day:not(.on):not(.today) .d-c{opacity:.4}
.hc-day{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:var(--tap);padding:2px 0}
.hc-day .d-l{font-size:.625rem;font-weight:600;color:var(--c-faint);text-transform:uppercase}
.hc-day .d-c{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-sm);font-weight:600;color:var(--c-muted);background:var(--c-surface-2);border:1.5px solid var(--c-stroke)}
.hc-day.today .d-c{border-color:var(--c-accent);color:var(--c-accent)}
.hc-day.on .d-c{background:var(--area-c);border-color:var(--area-c);color:#fff}
.hc-day .d-c .icon{width:16px;height:16px;stroke-width:3}
.hc-foot{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--c-muted);font-weight:600}
.hc-foot span{display:inline-flex;align-items:center;gap:4px}
.hc-foot .icon{width:14px;height:14px}

/* Formuláře v panelu */
.form{display:flex;flex-direction:column;gap:var(--sp-4)}
.field{display:flex;flex-direction:column;gap:var(--sp-2)}
.flabel{font-size:var(--fs-sm);color:var(--c-muted);font-weight:700}
.input{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--c-stroke);background:#fff;padding:0 14px;font:inherit;font-size:var(--fs-sm);font-weight:700;color:var(--c-text)}
.input::placeholder{color:var(--c-faint);font-weight:400;opacity:1}
textarea.input{padding:12px 14px;resize:none;line-height:1.4;overflow:hidden;min-height:88px}
.input:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 3px var(--c-accent-soft)}
.form[data-own-icon="off"] .f-icon{display:none}
.form[data-note="off"] .f-note{display:none}
.form .f-project,.form .f-recurring,.form .f-weekly,.form .f-list{display:none}
.form[data-type="single"][data-list="on"] .f-project,.form[data-type="single"] .f-list,.form[data-type="recurring"] .f-recurring,.form[data-freq="weekly"] .f-weekly{display:flex}
.list-line{display:flex;align-items:center;justify-content:space-between;min-height:var(--tap);width:100%}
/* Přepínač ve stylu iOS */
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch-track{position:absolute;inset:0;border-radius:999px;background:var(--c-stroke);transition:background var(--t-fast)}
.switch-track::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform var(--t-fast)}
.switch input:checked + .switch-track{background:var(--c-accent)}
.switch input:checked + .switch-track::after{transform:translateX(18px)}
.switch input:focus-visible + .switch-track{outline:2px solid var(--c-accent);outline-offset:2px}
.seg label{position:relative;display:inline-flex}
.seg label input{position:absolute;opacity:0;pointer-events:none}
.seg label span{height:38px;padding:0 var(--sp-3);border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:700;color:var(--c-muted);display:inline-flex;align-items:center;cursor:pointer}
.seg label input:checked + span{background:var(--c-accent);color:#fff}
.seg label input:focus-visible + span{outline:2px solid var(--c-accent);outline-offset:2px}
.seg{flex-wrap:wrap;align-self:flex-start}
label.pick{position:relative;cursor:pointer}
label.pick input{position:absolute;opacity:0;pointer-events:none}
label.pick:has(input:checked){border-color:var(--c-accent);background:var(--c-accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.chip-ico,.chip-col{position:relative;cursor:pointer}
.chip-ico input,.chip-col input{position:absolute;opacity:0;pointer-events:none}
.chip-ico span{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#fff;border:2px solid var(--c-stroke);color:var(--c-muted)}
.chip-ico input:checked + span{border-color:var(--c-accent);background:var(--c-accent-soft);color:var(--c-accent)}
.chip-col span{width:44px;height:44px;border-radius:14px;display:block;border:3px solid #fff;box-shadow:0 0 0 1px var(--c-stroke)}
.chip-col input:checked + span{box-shadow:0 0 0 3px var(--c-accent)}
.chip-ico input:focus-visible + span,.chip-col input:focus-visible + span{outline:2px solid var(--c-accent);outline-offset:2px}
.btn-wide-ghost{width:100%}
.icon-btn.icon-btn-bare{background:none;margin-left:-12px;width:40px}
.icon-btn-bare .icon{width:24px;height:24px}
.gchips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.gchips:empty{display:none}
.gchip{display:inline-flex;align-items:center;gap:2px;height:36px;padding:0 4px 0 12px;border-radius:var(--r-pill);background:var(--c-accent-soft);color:var(--c-accent);font-weight:600;font-size:var(--fs-sm)}
.gchip button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--c-accent);position:relative}
.gchip button::after{content:"";position:absolute;inset:-8px -4px}
.gchip .icon{width:14px;height:14px;stroke-width:2.4}
.gadd{display:flex;gap:var(--sp-2);align-items:center}
.gadd .btn-accent{width:48px;height:48px;border-radius:14px;flex:none}
.link-muted{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 var(--sp-1);color:var(--c-accent);font-size:var(--fs-sm);font-weight:600}
.link-muted .icon{width:16px;height:16px}
.subhead{padding:10px var(--sp-4) 4px;font-size:var(--fs-xs);font-weight:700;color:var(--c-muted);background:var(--c-surface-2);border-top:1px solid var(--c-stroke)}
.group-list > .subhead:first-child,.list > .subhead:first-child{border-top:0}
.pick-plain{padding:0 14px}
.filter-chips{margin-bottom:calc(-1 * var(--sp-2))}
.f-recurring-extra{flex-direction:column;gap:6px;margin:-6px 0 4px}
.f-recurring-extra .note{font-size:.6875rem}
.f-recurring-extra .f-every-custom{display:none}
.f-recurring-extra[data-every="custom"] .f-every-custom{display:block}
.field[hidden]{display:none}
.btn-x{width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;background:none;border:0;margin-right:-10px;color:var(--c-muted);flex:none}
.btn-x .icon{width:22px;height:22px;stroke-width:2.2}
.field-inline{flex-direction:row;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.field-inline .seg{align-self:auto}
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);min-height:var(--tap);width:100%;text-align:left}
.cat-val{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:var(--fs-sm)}
.cat-val .ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--area-c) 14%,#fff);color:var(--area-c)}
.cat-val .ico .icon{width:15px;height:15px}
.cat-chev{display:grid;place-items:center;color:var(--c-muted)}
.cat-val.is-none .ico{display:none}
.emo{font-size:1.15em;line-height:1;display:inline-block}
/* Poslední „ikona“ v mřížce: vlastní emoji ze systémové klávesnice. */
.chip-emoji{position:relative;width:44px;height:44px;border-radius:14px;background:#fff;border:2px dashed var(--c-stroke);display:grid;place-items:center;cursor:text}
.chip-emoji.is-on{border:2px solid var(--c-accent);background:var(--c-accent-soft)}
.emoji-val,.emoji-hint{grid-area:1/1}
.emoji-val{font-size:1.3rem;line-height:1}
.emoji-val:empty{display:none}
.emoji-hint{pointer-events:none;color:var(--c-muted);display:grid;place-items:center}
.emoji-hint .icon{width:20px;height:20px}
.chip-emoji.is-on .emoji-hint{display:none}
.chip-emoji[aria-expanded="true"]{border-color:var(--c-accent)}
.emoji-panel{margin-top:var(--sp-3);padding:var(--sp-3);max-height:280px;overflow-y:auto}
.emoji-gl{font-size:.6875rem;font-weight:700;color:var(--c-muted);margin:var(--sp-2) 0 4px}
.emoji-group:first-child .emoji-gl{margin-top:0}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr)}
.emoji-pick{height:44px;font-size:1.5rem;border-radius:10px;display:grid;place-items:center}
.emoji-pick:active{background:var(--c-accent-soft)}
.cat-val.is-none .cat-name{color:var(--c-muted);font-weight:500}
/* Rozbalovací nabídka jako nativní pull-down menu v iOS: plave nad obsahem, zarovnaná vpravo. */
.cat-field{position:relative}
/* Nastavení úkolu jako seskupená karta v iOS: řádky těsně pod sebou s jemnou linkou. */
.set-card{overflow:visible;padding:0;background:none !important;box-shadow:none !important;border:0 !important;border-radius:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.set-card > .field{padding:0;gap:0;position:relative}
.date-right{position:relative}
/* Viditelný je jen text (datum nebo „Nevybráno“), nativní pole leží neviditelně přes něj a otevírá kalendář. */
.set-card .date-pill{position:absolute;inset:0;width:100%;height:100%;min-width:0;padding:0;opacity:0;background:none}
.date-text{line-height:var(--tap)}
.f-date:not(.has-date) .date-text{color:var(--c-muted);font-weight:500}
.form[data-type="recurring"] .f-date-note{display:none}
.form .f-start{display:none}
.form[data-type="recurring"] .f-start{display:flex}
.f-date-note{margin-top:-8px}
.form .cat-field:not(.set-card > *){margin-top:-10px}
.cat-list{position:absolute;z-index:20;right:0;top:calc(100% - 4px);min-width:230px;max-height:60vh;overflow-y:auto;border-radius:14px;box-shadow:0 12px 40px rgba(28,22,51,.22),0 0 0 .5px rgba(28,22,51,.08);background:var(--c-surface);transform-origin:top right;animation:menu-in .16s ease-out}
.cat-list.up{top:auto;bottom:calc(100% - 4px);transform-origin:bottom right}
@keyframes menu-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cat-list{animation:none}}
.cat-opt{display:flex;align-items:center;gap:var(--sp-3);min-height:44px;padding:0 var(--sp-4);position:relative;font-weight:600;cursor:pointer}
.cat-opt + .cat-opt::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--c-stroke)}
.cat-opt input{position:absolute;opacity:0;pointer-events:none}
.cat-opt .ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--area-c) 14%,#fff);color:var(--area-c);flex:none}
.cat-opt .ico .icon{width:15px;height:15px}
.cat-opt-name{flex:1}
.cat-tick{color:var(--c-accent);visibility:hidden;display:grid}
.cat-tick .icon{width:18px;height:18px;stroke-width:2.6}
.cat-opt:has(input:checked) .cat-tick{visibility:visible}
.cat-opt:has(input:focus-visible){outline:2px solid var(--c-accent);outline-offset:-2px}
.cat-chev .icon{width:18px;height:18px;transition:transform var(--t-fast)}
.cat-head[aria-expanded="true"] .cat-chev .icon{transform:rotate(180deg)}
.form .seg{padding:3px}
.form .seg label span{height:30px;padding:0 10px;font-size:var(--fs-xs)}
.btn-skip{flex:none;height:32px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--c-stroke);background:var(--c-surface-2);color:var(--c-muted);font-size:var(--fs-xs);font-weight:600;position:relative;white-space:nowrap}
.btn-skip::after{content:"";position:absolute;inset:-6px -2px}
.btn-goal{width:var(--tap);height:var(--tap);display:grid;place-items:center;color:var(--c-faint);border-radius:var(--r-md);flex:none;margin-right:-6px}
.btn-goal .icon{width:20px;height:20px}
.btn-goal.on{color:var(--c-accent)}
.btn-goal.on .t-core{fill:currentColor}
.check.done-static .icon{opacity:1}
.check:disabled{cursor:default;opacity:.7}

/* Oblasti */
.areas{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.area{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);text-align:left;min-height:156px;transition:transform var(--t-fast)}
.area:active{transform:scale(.98)}
.area .ico,.sheet-head .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--area-c) 14%,#fff);color:var(--area-c);flex:none}
.area .name{font-family:var(--f-display);font-weight:800;font-size:var(--fs-md)}
.area .dir{font-size:.6875rem;color:var(--c-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.area .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-xs);color:var(--c-muted);font-weight:600;font-variant-numeric:tabular-nums}
.area .dots{display:flex;gap:3px}
.area .dots i{width:6px;height:6px;border-radius:2px;background:var(--c-stroke)}
.area .dots i.on{background:var(--area-c)}

/* Týden */
.week{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-4)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.kpi{background:var(--c-surface-2);border-radius:var(--r-md);padding:var(--sp-3)}
.kpi .label{font-size:var(--fs-xs);color:var(--c-muted);font-weight:600}
.kpi .num{font-family:var(--f-display);font-size:var(--fs-xl);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .num small{font-size:var(--fs-sm);color:var(--c-muted);font-weight:600;margin-left:2px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--c-faint);font-size:10px;font-family:var(--f-body);font-weight:600}
.chart .today-l{fill:var(--c-accent);font-weight:800}
.chart .grid{stroke:var(--c-stroke)}
.chart .bar{fill:var(--c-accent-soft)}
.review{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border-radius:var(--r-md);background:var(--c-accent-soft);color:var(--c-accent)}
.review .txt{flex:1;min-width:0;color:var(--c-text)}
.review .txt b{display:block;font-size:var(--fs-sm)}
.review .txt span{font-size:var(--fs-xs);color:var(--c-muted)}
.btn-ghost{height:36px;padding:0 var(--sp-4);border-radius:var(--r-pill);background:var(--c-accent);color:#fff;font-size:var(--fs-sm);font-weight:700;min-width:var(--tap);position:relative}
.btn-ghost::after{content:"";position:absolute;inset:-4px 0}

/* Navigace jako pilulka (jemné sklo) */
.tabbar{
  position:fixed;z-index:5;left:50%;transform:translateX(-50%);
  bottom:var(--tabbar-bottom);
  width:min(448px,calc(100% - 32px));
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:6px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.82);border:1px solid var(--c-stroke);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 12px 30px rgba(115,66,203,.16);
}
.tab{height:52px;border-radius:var(--r-pill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.6875rem;font-weight:600;color:var(--c-muted);position:relative}
.tab[aria-current="page"]{color:#fff;background:var(--c-accent);box-shadow:0 6px 14px rgba(115,66,203,.35)}
.tab .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--c-crit);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}

.section-head{align-items:center}
.btn-plus{width:var(--tap);height:var(--tap);display:grid;place-items:center;background:none;color:var(--c-accent);margin:-10px -10px -10px 0;flex:none}
.btn-plus .icon{width:24px;height:24px;stroke-width:2.4}
.btn-edit-subtle{color:var(--c-muted)}
/* Dlaždice návyků v Cíli dne */
.hstrip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:var(--sp-4);margin:0 calc(-1 * var(--sp-4));padding:4px var(--sp-4) 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hstrip::-webkit-scrollbar{display:none}
.htile{position:relative;flex:none;width:152px;min-height:104px;padding:12px 8px 10px;border-radius:18px;background:var(--c-surface);border:1px solid var(--c-stroke);display:flex;flex-direction:column;align-items:center;gap:8px;scroll-snap-align:start;color:var(--c-text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-x;transition:background var(--t-fast),transform var(--t-fast)}
.htile:active{transform:scale(.97)}
.htile-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--area-c) 14%,#fff);color:var(--area-c)}
.htile-ico .icon{width:22px;height:22px}
.htile-name{font-size:var(--fs-sm);font-weight:700;line-height:1.2;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.htile.on{background:color-mix(in srgb,var(--area-c) 16%,#fff);border-color:color-mix(in srgb,var(--area-c) 45%,#fff)}
.htile-check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--c-good);color:#fff;display:grid;place-items:center}
.htile-check .icon{width:14px;height:14px;stroke-width:3}
.htile.skipped{opacity:.55;filter:grayscale(1)}
.htile-week{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:auto}
.htile-week .htile-note{order:-1}
.htile-note{font-size:11px;color:var(--c-muted);font-weight:700;font-variant-numeric:tabular-nums}
.htile[aria-disabled="true"]{cursor:default}
.htile-menu{position:fixed;z-index:60;min-width:200px;border-radius:14px;background:var(--c-surface);box-shadow:0 12px 40px rgba(28,22,51,.22),0 0 0 .5px rgba(28,22,51,.08);overflow:hidden;animation:menu-in .16s ease-out}
.htile-menu button{display:flex;align-items:center;width:100%;min-height:44px;padding:0 var(--sp-4);font-weight:600;color:var(--c-text);text-align:left}
.wdots-link{display:flex;align-items:center;min-height:var(--tap);padding:0 4px;margin-right:-4px;background:none;flex:none}
.btn-edit-subtle .icon{width:22px;height:22px;stroke-width:2}
/* Listování dny a kalendář */
.day-title{text-align:center;color:inherit;padding:0;display:block;min-width:0;flex:1;min-height:var(--tap)}
.day-top{position:relative}
.day-top .icon-btn-subtle{position:absolute;top:-12px;right:-10px;margin:0}
.day-row{display:flex;align-items:center;margin-left:-8px;margin-right:-8px}
.day-row .day-btn{flex:none;opacity:.85}
.day-greet{text-align:center;padding:0 44px}
.day-ctrl{display:flex;align-items:center;gap:0;margin:6px 0 -8px -9px}
.day-btn{width:32px;height:var(--tap);display:grid;place-items:center;color:#fff;border-radius:12px}
.day-btn .icon{width:20px;height:20px}
.day-btn.dark{color:var(--c-accent)}
.day-today{height:30px;padding:0 12px;border-radius:var(--r-pill);background:rgba(255,255,255,.2);color:#fff;font-size:var(--fs-xs);font-weight:700;position:relative}
.day-today::after{content:"";position:absolute;inset:-7px 0}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font-family:var(--f-display);font-size:var(--fs-lg)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-wd{font-size:var(--fs-xs);font-weight:700;color:var(--c-faint);text-transform:uppercase;padding:4px 0}
.cal-d{position:relative;height:var(--tap);border-radius:12px;font-weight:600;color:var(--c-text);font-variant-numeric:tabular-nums}
.cal-d.is-today{color:var(--c-accent);box-shadow:inset 0 0 0 1.5px var(--c-accent)}
.cal-d.is-sel{background:var(--c-accent);color:#fff}
.cal-dot{position:absolute;left:50%;bottom:5px;width:5px;height:5px;border-radius:50%;transform:translateX(-50%);display:block}
.cal-legend .cal-dot{position:static;transform:none;display:inline-block;margin-right:6px}
.cal-dot.plan{background:var(--c-accent)}
.cal-dot.late{background:var(--c-crit)}
.cal-dot.done{background:var(--c-good)}
.cal-d.is-sel .cal-dot{background:#fff}
.cal-legend{display:flex;flex-wrap:wrap;gap:var(--sp-4);font-size:var(--fs-xs);color:var(--c-muted)}
.date-line{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);min-height:var(--tap)}
.date-right{display:inline-flex;align-items:center;gap:4px}
/* Datum vpravo jako nativní iOS „pilulka“; prázdné pole ukáže „Bez data“. */
.date-pill{appearance:none;-webkit-appearance:none;border:0;border-radius:8px;background:var(--c-surface-2);color:var(--c-text);font:600 var(--fs-sm)/1 var(--f-body);height:34px;padding:0 10px;min-width:110px;text-align:center}
.date-pill:invalid,.date-pill[value=""]{color:var(--c-muted)}
.date-pill{position:relative;cursor:pointer}
/* Neviditelný ovladač kalendáře přes celé pole: klepnutí kamkoli otevře kalendář, ikona se neukazuje. */
.date-pill::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;margin:0;padding:0;opacity:0;cursor:pointer}
.form[data-type="recurring"] .f-date{display:none !important}
.must .list{box-shadow:0 0 0 1.5px rgba(229,72,122,.35),var(--shadow)}
.must-count{background:#fde7ef;color:var(--c-crit)}

/* Rychlý zápis pod dnešními činnostmi */
.capture-card{background:var(--c-accent);border-radius:var(--r-xl);padding:var(--sp-4) var(--sp-4) var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-3);box-shadow:var(--shadow-accent);color:#fff}

/* Plovoucí tlačítko pro nový úkol */
.fab{position:fixed;z-index:6;right:max(16px,calc(50% - 224px));bottom:calc(var(--tabbar-bottom) + 80px);width:56px;height:56px;border-radius:50%;
  display:grid;place-items:center;background:var(--c-accent);color:#fff;box-shadow:0 10px 24px rgba(115,66,203,.45);transition:transform var(--t-fast),opacity var(--t-fast)}
.fab .icon{width:26px;height:26px;stroke-width:2.4}
.fab:active{transform:scale(.94)}
.toast:not([hidden]) ~ .fab{opacity:0;pointer-events:none}
@media (min-width:600px) and (min-height:640px){ .fab{right:16px} }

/* Sheet + dialog */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(28,22,51,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{
  width:100%;max-width:480px;max-height:86%;overflow:auto;
  border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--sp-3) var(--sp-5) calc(var(--sab) + var(--sp-6));
  background:var(--c-bg);
  display:flex;flex-direction:column;gap:var(--sp-3);
  animation:up 240ms ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grabber{width:40px;height:5px;border-radius:3px;background:#d6cbee;margin:0 auto}
.sheet-head{display:flex;align-items:center;gap:var(--sp-3)}
.sheet-head h3{flex:1;margin:0;font-family:var(--f-display);font-size:var(--fs-xl);font-weight:800}
.profile{display:flex;flex-direction:column;gap:var(--sp-3)}
.profile-link{width:100%;display:flex;align-items:center;gap:var(--sp-3);min-height:56px;text-align:left;color:var(--c-text)}
.profile-link .profile-label{flex:1;font-weight:600}
.profile-ver{text-align:center}
.backup-note{margin:0 var(--sp-1)}
.backup-last{margin:0 var(--sp-1) var(--sp-2)}
.profile label.btn-wide{height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.profile-val{color:var(--c-muted);font-size:var(--fs-sm)}
.profile-link .icon{color:var(--c-muted)}
.profile-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--c-surface-2)}
.profile-ico .icon{color:var(--c-accent)}
.block{padding:var(--sp-4);border-radius:var(--r-lg);background:var(--c-surface);border:1px solid var(--c-stroke);display:flex;flex-direction:column;gap:var(--sp-2)}
.block h4{margin:0;font-size:var(--fs-sm);color:var(--c-accent);font-weight:700}
.block p{margin:0}
.btn-row{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.btn{height:var(--tap);padding:0 var(--sp-4);border-radius:var(--r-pill);background:var(--c-surface);border:1px solid var(--c-stroke);font-weight:700;font-size:var(--fs-sm);color:var(--c-accent)}
.btn.danger{color:var(--c-crit);border-color:#f7c7d7}
/* Smazání jako nenápadné textové tlačítko hned pod hlavním tlačítkem. */
.btn-text-danger{align-self:center;min-height:var(--tap);margin-top:-10px;padding:0 var(--sp-4);color:var(--c-crit);font-weight:600;font-size:var(--fs-sm)}
.seg{display:inline-flex;padding:4px;border-radius:var(--r-pill);background:var(--c-surface-2);border:1px solid var(--c-stroke)}
.seg button{height:38px;padding:0 var(--sp-4);border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:700;color:var(--c-muted)}
.seg button[aria-pressed="true"]{background:var(--c-accent);color:#fff}
.seg-full{display:flex;align-self:stretch;width:100%}
.seg-full button{flex:1;height:44px}
.note{font-size:var(--fs-xs);color:var(--c-muted)}
textarea.dump{width:100%;min-height:90px;border-radius:var(--r-sm);background:var(--c-surface-2);color:var(--c-muted);border:1px solid var(--c-stroke);font:12px/1.4 ui-monospace,Menlo,monospace;padding:var(--sp-2)}
.dialog{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:var(--sp-6);background:rgba(28,22,51,.4)}
.dialog[hidden]{display:none}
.dialog .box{max-width:340px;width:100%;padding:var(--sp-5);border-radius:var(--r-lg);background:var(--c-surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:var(--sp-4)}
.dialog .box p{margin:0}

/* Toast */
/* Malá oznámení nahoře uprostřed, krátce. */
.toast{
  position:fixed;z-index:40;left:50%;transform:translateX(-50%);
  top:calc(var(--sat) + 8px);
  max-width:calc(100% - 32px);min-height:34px;
  display:flex;align-items:center;gap:var(--sp-2);padding:4px 14px;
  border-radius:var(--r-pill);background:var(--c-text);color:#fff;box-shadow:var(--shadow);
  font-size:var(--fs-xs);font-weight:600;animation:toast-in .18s ease-out;
}
.toast[hidden]{display:none}
.toast:has(button){padding-right:4px}
.toast button{position:relative;height:26px;padding:0 10px;color:#c7b8ff;font-weight:800;font-size:var(--fs-xs)}
.toast button::after{content:"";position:absolute;inset:-9px -4px}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

.badge-demo{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.65);font-size:.625rem;font-weight:500;margin-top:var(--sp-2)}


/* ===== Mockup telefonu: jen na širší obrazovce. Na telefonu běží apka na celou plochu. ===== */
.statusbar,.island,.homebar{display:none}
/* Pevné rozvržení: lišta dole je vždy u spodního okraje obrazovky, posouvá se jen obsah. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
.stage,.device{height:100%}
/* Obrazovka je přišpendlená k oknu (iOS jinak při přetažení posune celou stránku i s lištou). */
.screen{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;transform:translateZ(0)}
/* Apka z plochy (iOS 26): okno končí nad zónou home indikátoru, i když safe-area hlásí rezervu. Pak lišta nepotřebuje odsazení navíc. */
html.vp-short{--tabbar-bottom:10px}
.scroller{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
@media (min-width:600px) and (min-height:640px){
  html,body{height:auto;min-height:100%;overflow:auto}
  body{background:var(--device-bg)}
  .stage,.device{height:auto}
  .stage{min-height:100vh;display:grid;place-items:center;padding:32px 16px;
    background:none}
  .device{width:390px;height:min(844px,calc(100vh - 64px));padding:12px;border-radius:62px;background:var(--device-frame);
    box-shadow:inset 0 0 0 2px #3b3160,0 0 0 10px color-mix(in srgb,var(--device-ring) 45%,transparent),0 30px 60px rgba(20,16,40,.22)}
  .screen{position:relative;height:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--c-bg);transform:translateZ(0);--sat:50px;--sab:22px}
  .scroller{height:100%;overflow-y:auto;scrollbar-width:none}
  .scroller::-webkit-scrollbar{display:none}
  .statusbar{display:flex;position:absolute;z-index:50;top:0;left:0;right:0;height:50px;padding:4px 30px 0 34px;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;color:#fff;pointer-events:none}
  .statusbar .sys{display:flex;gap:6px;align-items:center}
  .statusbar svg{height:12px;width:auto;fill:currentColor}
  .island{display:block;position:absolute;z-index:51;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000}
  .homebar{display:block;position:absolute;z-index:60;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--c-text);opacity:.85;pointer-events:none}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

// Migrace: každá funkce převede data z verze N na N+1. Data uživatele se nikdy nemažou.
const MIGRATIONS = {
  // v1 -> v2: kategorie mohou mít podskupiny (např. místnosti). Nic se nemaže.
  1: d => {
    d.areas.forEach(a => { if (!Array.isArray(a.groups)) a.groups = []; });
    if (d.demo) {
      const home = d.areas.find(a => a.id === "home");
      if (home && !home.groups.length) {
        home.groups = [{ id: "g-living", name: "Obývák" }, { id: "g-kitchen", name: "Kuchyň" }, { id: "g-bedroom", name: "Ložnice" }];
        d.tasks.forEach(x => { if (x.areaId === "home" && /povlečení|šatník/i.test(x.title)) x.groupId = "g-bedroom"; });
      }
    }
    d.version = 2; return d;
  },
  // v2 -> v3: cíle dne ({ "YYYY-MM-DD": ["t:<id>", "h:<id>"] }). Nic se nemaže.
  2: d => { if (!d.goals || typeof d.goals !== "object") d.goals = {}; d.version = 3; return d; },
};
function migrate(d) {
  if (!d || typeof d !== "object" || typeof d.version !== "number") throw new Error("invalid");
  let data = d;
  while (data.version < DATA_VERSION) {
    const step = MIGRATIONS[data.version];
    if (!step) throw new Error("no-migration");
    data = step(data);
  }
  if (!Array.isArray(data.areas) || !Array.isArray(data.tasks) || !Array.isArray(data.habits) || !Array.isArray(data.inbox)) throw new Error("invalid");
  data.meta = data.meta || { lastBackup: null, reviewWeekday: 0 };
  return data;
}

const icon = (name, cls = "icon") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let expanded = new Set();
const expandedAreas = new Set();
let archiveOpen = false;
const SWIPE_ACT_W = 72; // šířka jedné akce pod swajpem (px)
const HABIT_WEEKS = 12; // kolik týdnů zpět jde u návyku odswajpovat
const habitWeekPos = {}; // pozice swajpu u jednotlivých návyků (jen v paměti)
let habitFilter = null;
let areasFrom = "home"; // odkud se otevřela stránka Kategorie (tužka u Na výběr, nebo Profil) – kam vede Zpět a která záložka svítí
let doneTodayOpen = false; // rozbalený seznam „Dokončeno“ na přehledu (jen v paměti) // filtr kategorie na záložce Návyky (jen v paměti)
function view() {
  const h = location.hash.slice(1);
  if ((h === "inbox" && canUse("inbox")) || h === "areas" || h === "habits" || h === "profile" || h === "profile-lang" || h === "profile-backup") return { name: h };
  if (h.startsWith("area-") && areaById(h.slice(5))) return { name: "area", id: h.slice(5) };
  return { name: "home" };
}
function go(target) {
  if (target) { if (location.hash !== "#" + target) location.hash = target; else render(); }
  else { history.replaceState(null, "", location.pathname + location.search); render(); }
}

function renderHabit(h) {
  const a = areaById(h.areaId); const p = habitProgress(h); const done = habitDoneToday(h);
  const C = 2 * Math.PI * 18;
  const sub = h.freq.type === "daily" ? t().streak(habitStreak(h)) : t().weekly(habitWeekCount(h), h.freq.times);
  return `<button class="habit glass ${done ? "is-done" : ""}" data-action="nav" data-view="habits" aria-label="${esc(h.title)}: ${sub}">
    <div class="ring">
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="track" cx="22" cy="22" r="18" fill="none" stroke-width="4"/>
      <circle class="val" cx="22" cy="22" r="18" fill="none" stroke="${done ? "#fff" : a.color}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}"/></svg>
      <div class="mark" style="color:${done ? "#fff" : a.color}">${done ? icon("check") : icon(a.icon)}</div>
    </div>
    <div class="name">${esc(h.title)}</div>
    <div class="sub">${h.freq.type === "daily" ? icon("flame") : icon("repeat")}${sub}</div>
  </button>`;
}

// mode: "full" (pruh, oblast, priorita) | "grouped" (nic navíc) | "area" (jen priorita + úprava)
function renderTask(task, mode = "full") {
  if (mode === true) mode = "grouped";
  const a = taskArea(task);
  const showStripe = mode === "full", showMeta = mode === "must" || mode === "goal", showArea = mode === "full", showPrio = false, canEdit = mode === "area";
  const prio = showPrio ? `<span class="pill p${task.priority}">${t().prio[task.priority - 1]}</span>` : "";
  const areaTag = showArea ? `<span style="display:inline-flex;align-items:center;gap:5px"><i class="dot" style="background:${a.color}"></i>${esc(a.name)}</span>` : (showMeta && a.id ? `<span class="meta">${esc(a.name)}</span>` : "");
  const stripe = showStripe ? `<i class="stripe" style="background:${a.color}"></i>` : "";
  // Akce „Na zítra“ a „Cíl dne“ jsou schované pod swajpem doleva. V „Na výběr“ jen Cíl.
  const acts = [
    mode === "grouped" && curDay() >= todayISO() && !task.done ? skipAction("hide-day", task.id, task.title) : "",
    (mode === "future" || mode === "goal" || mode === "must") && !task.done && !(task.type === "recurring" && task.nextDue > todayISO()) ? skipAction("skip", task.id, task.title) : "",
    (mode === "grouped" && curDay() >= todayISO()) || mode === "goal" ? goalAction("t", task.id, task.title, mode === "goal") : "",
    mode === "must" && curDay() === todayISO() && !task.done ? `<button class="sw-act sw-goal on" data-action="later" data-id="${task.id}" aria-label="${t().goalOff}: ${esc(task.title)}">${icon("later")}<span>${t().goalOff}</span></button>` : "",
  ].join("");
  const fmtShort = d => new Intl.DateTimeFormat(lang, { weekday: "short", day: "numeric", month: "numeric" }).format(new Date(d + "T12:00:00"));
  const hasDeadline = task.date && task.type !== "recurring";
  // Termín jako šedý text pod názvem; po termínu, v den termínu a den předem červeně.
  const daysLeft = hasDeadline ? Math.round((new Date(task.date + "T12:00:00") - new Date(curDay() + "T12:00:00")) / 864e5) : null;
  const dueText = !hasDeadline || task.done ? "" : daysLeft < 0 ? t().overdueSince(fmtShort(task.date)) : daysLeft === 0 ? t().dueToday : t().dueBy(fmtShort(task.date));
  const dateTag = dueText ? `<span class="meta ${daysLeft <= 1 ? "due-soon" : ""}">${dueText}</span>` : "";
  const rightTag = "";
  const skipTag = (mode === "area" && isSkippedToday(task) ? `<span class="pill p3">${t().skipped}</span>` : "")
    + (mode === "area" && task.followUp && canUse("followUps") ? `<span class="pill p3">${t().followTag(esc(task.followUp.split("\n").join(" → ")))}</span>` : "");
  const editBtn = ""; // úprava klepnutím na název; tužka už se nepoužívá
  const fmtDay = d => new Intl.DateTimeFormat(lang, { day: "numeric", month: "long" }).format(new Date(d + "T12:00:00"));
  if (task.type === "project") {
    const { d, n } = projectProgress(task); const open = expanded.has(task.id);
    const listDone = !!task.done || (n > 0 && d === n);
    return swipeWrap(acts, `<div class="row ${listDone && mode !== "area" ? "is-done" : ""} ${mode === "area" ? "no-check" : ""}" data-row="${task.id}" ${dragAttr(mode, "t", task)}>
      ${stripe}
      ${mode === "area" ? ""
        : `<button class="check" role="checkbox" aria-checked="${listDone}" data-action="task" data-id="${task.id}" aria-label="${esc(task.title)}"><span>${icon("check")}</span></button>`}
      <div class="body">
        <button class="title title-link" data-action="task-edit" data-id="${task.id}">${esc(task.title)}</button>
        <div class="tags">${prio}${areaTag}${dateTag}${skipTag}<span class="meta">${t().project} (${d}/${n})</span></div>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${d}"><i style="width:${n ? (d / n) * 100 : 0}%"></i></div>
      </div>
      ${rightTag}${editBtn}
      <button class="expand" data-action="expand" data-id="${task.id}" aria-expanded="${open}" aria-label="${t().showSteps}">${icon("chevron")}</button>
    </div>`) + `
    ${open ? `<div class="subtasks">${task.subtasks.map(st => `
      <div class="subtask ${st.done ? "is-done" : ""}">
        <button class="check" role="checkbox" aria-checked="${st.done}" data-action="sub" data-id="${task.id}" data-sub="${st.id}" aria-label="${esc(st.title)}"><span>${icon("check")}</span></button>
        <span class="label">${esc(st.title)}</span>
      </div>`).join("")}</div>` : ""}`;
  }
  let extra = "";
  if (task.type === "recurring" && mode !== "grouped" && mode !== "goal") {
    const waiting = task.nextDue > todayISO();
    const nextTxt = t().nextIn(Math.round((new Date(task.nextDue + "T12:00:00") - new Date(todayISO() + "T12:00:00")) / 864e5));
    extra = mode === "area" ? (waiting ? `<span class="meta">${nextTxt}</span>` : "")
      : `<span style="display:inline-flex;align-items:center;gap:4px">${icon("repeat", "icon")}${waiting ? nextTxt : t().recurring(task.everyDays)}</span>`;
  }
  const checked = task.type === "recurring" ? task.nextDue > todayISO() : !!task.done;
  return swipeWrap(acts, `<div class="row ${checked && mode !== "area" ? "is-done" : ""} ${mode === "area" ? "no-check" : ""}" ${dragAttr(mode, "t", task)}>
    ${stripe}
    ${mode === "area" ? "" : `<button class="check" role="checkbox" aria-checked="${checked}" data-action="task" data-id="${task.id}" aria-label="${esc(task.title)}" ${task.type === "recurring" && checked ? "disabled" : ""}><span>${icon("check")}</span></button>`}
    <div class="body">
      <button class="title title-link" data-action="task-edit" data-id="${task.id}">${esc(task.title)}</button>
      <div class="tags">${prio}${areaTag}${mode === "area" || mode === "grouped" ? "" : dateTag}${skipTag}${extra}</div>
    </div>
    ${task.type === "recurring" && (mode === "grouped" || mode === "area") ? `<span class="rep-badge" aria-label="${t().recurring(task.everyDays)}">${icon("repeat")}${t().everyShort(task.everyDays)}</span>` : ""}
    ${(mode === "area" || mode === "grouped") && dueText ? `<span class="rep-badge ${daysLeft <= 1 ? "due-soon" : ""}">${dueText}</span>` : ""}
    ${rightTag}${editBtn}
  </div>`);
}

// Přetažení (podržet prst): jen v Cíli dne, u úkolů s datem a v „Na výběr“ (úkoly v rámci jedné podskupiny).
function dragAttr(mode, kind, x) {
  if (curDay() < todayISO()) return "";
  if (mode === "goal") return `data-drag="${kind}:${x.id}" data-dgroup="${kind === "h" ? "goal-h" : "day-t"}"`;
  if (kind !== "t") return "";
  if (mode === "must") return `data-drag="t:${x.id}" data-dgroup="day-t"`;
  if (mode === "grouped") return `data-drag="t:${x.id}" data-dgroup="b-${x.areaId}"`;
  return "";
}
function applyOrder(dgroup, keys) {
  if (dgroup === "areas") { const ids = keys.map(k => k.slice(2)); state.areas.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id)); }
  else if (dgroup === "habits") { // pořadí návyků: přeřadí jen zobrazené (např. po filtru kategorie), ostatní zůstanou na svých místech
    const ids = keys.map(k => k.slice(2)); const slots = state.habits.map((h, i) => ids.includes(h.id) ? i : -1).filter(i => i >= 0);
    const moved = ids.map(id => state.habits.find(h => h.id === id)).filter(Boolean); slots.forEach((slot, i) => { state.habits[slot] = moved[i]; });
  }
  else if (dgroup === "day-t") keys.forEach((k, i) => { const x = state.tasks.find(x => x.id === k.slice(2)); if (x) x.dayOrder = i; });
  else if (dgroup === "goal" || dgroup === "goal-h") { const d = curDay(); const rest = goalsOf(d).filter(k => !keys.includes(k)); state.goals[d] = [...keys, ...rest]; }
  else keys.forEach((k, i) => { const x = state.tasks.find(x => x.id === k.slice(2)); if (x) x.order = i; });
  save();
}

function skipAction(action, id, title) {
  return `<button class="sw-act sw-skip" data-action="${action}" data-id="${id}" aria-label="${t().skip}: ${esc(title)}">${icon("skip")}<span>${t().skip}</span></button>`;
}
function goalAction(kind, id, title, on) {
  return `<button class="sw-act sw-goal ${on ? "on" : ""}" data-action="goal" data-kind="${kind}" data-id="${id}" aria-pressed="${on}" aria-label="${on ? t().goalRemove : t().goalAdd}: ${esc(title)}">${icon(on ? "later" : "target")}<span>${on ? t().goalOff : t().goalOn}</span></button>`;
}
// Řádek s akcemi pod swajpem. Bez akcí vrací řádek beze změny.
function swipeWrap(acts, row) {
  if (!acts) return row;
  const n = (acts.match(/class="sw-act/g) || []).length;
  return `<div class="swipe" style="--sw-w:${n * SWIPE_ACT_W}px"><div class="sw-acts">${acts}</div>${row}</div>`;
}

// Úkoly rozdělené podle podskupin kategorie (např. místností). extra = řádky navíc do „Ostatní“.
// Podskupiny vždy podle abecedy, „Ostatní“ jako záchytná skupina na konci.
const isOtherGroup = n => n.trim().toLowerCase() === t().otherGroup.toLowerCase();
const byGroupName = (a, b) => (isOtherGroup(a) - isOtherGroup(b)) || a.localeCompare(b, lang);
const sortedGroups = area => [...(area.groups || [])].sort((x, y) => byGroupName(x.name, y.name));

function renderByGroups(area, items, mode, extra = "") {
  const all = sortedGroups(area);
  const known = new Set(all.map(g => g.id));
  const otherG = all.find(g => g.name.trim().toLowerCase() === t().otherGroup.toLowerCase());
  const inGroup = (x, g) => x.groupId === g.id || (otherG && g.id === otherG.id && (!x.groupId || !known.has(x.groupId)));
  const groups = all.filter(g => items.some(x => inGroup(x, g)) || (otherG && g.id === otherG.id && extra));
  if (!groups.length) return items.map(x => renderTask(x, mode)).join("") + extra;
  const rest = otherG ? [] : items.filter(x => !x.groupId || !known.has(x.groupId));
  return groups.map(g => `<div class="subhead">${esc(g.name)}</div>${items.filter(x => inGroup(x, g)).map(x => renderTask(x, mode)).join("")}${otherG && g.id === otherG.id ? extra : ""}`).join("")
    + (!otherG && (rest.length || extra) ? `<div class="subhead">${t().otherGroup}</div>${rest.map(x => renderTask(x, mode)).join("")}${extra}` : "");
}

// Tečky Po–Ne aktuálního týdne: které dny je návyk splněný.
function habitWeekDots(h, ref = curDay()) {
  const today = todayISO(); const r = new Date(ref + "T12:00:00"); const mon = day(-((r.getDay() + 6) % 7), r);
  const days = Array.from({ length: 7 }, (_, i) => iso(day(i, mon)));
  const n = days.filter(k => h.log[k]).length;
  return `<span class="wdots" style="--area-c:${areaById(h.areaId).color}" role="img" aria-label="${t().weekDone(n)}">${days.map(k => `<i class="${h.log[k] ? "on" : ""} ${k === today ? "today" : ""} ${k > today ? "future" : ""}"></i>`).join("")}</span>`;
}

function renderHabitRow(h, mode = "grouped") {
  const done = !!h.log[curDay()]; const future = curDay() > todayISO();
  const acts = done || mode !== "goal" ? "" : skipAction("skip-habit", h.id, h.title);
  return swipeWrap(acts, `<div class="row ${done ? "is-done" : ""}" ${dragAttr(mode, "h", h)}>

    <button class="check" role="checkbox" aria-checked="${done}" data-action="habit" data-id="${h.id}" aria-label="${esc(h.title)}" ${future ? "disabled" : ""}><span>${icon("check")}</span></button>
    <div class="body">
      <button class="title title-link" data-action="habit-edit" data-id="${h.id}">${esc(h.title)}</button>
      ${mode === "goal" ? `<div class="tags"><span class="meta">${esc(areaById(h.areaId).name)}</span></div>` : ""}
    </div>
    <button class="wdots-link" data-action="nav" data-view="habits" aria-label="${t().openHabits}">${habitWeekDots(h)}</button>
  </div>`);
}

function renderToday(tasks, withHabits = true, mode = "grouped") {
  const d = curDay(), future = d > todayISO();
  if (mode === "grouped") tasks = tasks.filter(x => !isGoal("t", x.id, d));
  const habits = withHabits ? state.habits.filter(h => (future ? !(h.skips && h.skips[d]) : habitIsDueToday(h)) && !isGoal("h", h.id, d)) : [];
  if (!tasks.length && !habits.length) return `<div class="list glass"><div class="empty">${t().noTasks}</div></div>`;
  const groups = [...state.areas, noArea()].map(a => ({ a, items: tasks.filter(x => a.id ? x.areaId === a.id : !areaById(x.areaId)), habits: habits.filter(h => h.areaId === a.id) }))
    .filter(g => g.items.length || g.habits.some(h => !h.log[d]))
    ; // pořadí kategorií si uživatelka určuje přetažením v Kategoriích
  if (!groups.length) return `<div class="list glass"><div class="empty">${t().noTasks}</div></div>`;
  return `<div class="groups">${groups.map(g => {
    const { a, items } = g; const open = expandedAreas.has(a.id);
    const left = items.length + g.habits.filter(h => !h.log[d]).length;
    return `<div class="group glass ${open ? "is-open" : ""}" style="--area-c:${a.color}">
      <button class="group-head" data-action="expand-area" data-id="${a.id}" aria-expanded="${open}">
        <span class="ico">${areaIcon(a)}</span>
        <span class="g-body g-row"><span class="g-name">${esc(a.id ? a.name : t().noAreaGroup)}</span><span class="g-count ${left ? "" : "zero"}" aria-label="${t().openTasks(left)}">${left ? left : icon("check")}</span></span>
        <span class="g-chev">${icon("chevron")}</span>
      </button>
      ${open ? `<div class="group-list">${renderByGroups(a, items, mode, g.habits.map(renderHabitRow).join(""))}</div>` : ""}
    </div>`;
  }).join("")}</div>`;
}

function renderArea(a) {
  const n = state.tasks.filter(x => x.areaId === a.id && taskIsOpen(x)).length;
  const nh = state.habits.filter(h => h.areaId === a.id).length;
  return `<button class="area glass" style="--area-c:${a.color}" data-action="area" data-id="${a.id}" data-drag="a:${a.id}" data-dgroup="areas">
    <div class="ico">${areaIcon(a)}</div>
    <div>
      <div class="name">${esc(a.name)}</div>
      <div class="dir">${esc(a.direction)}</div>
    </div>
    <div class="foot"><span>${t().openTasks(n)} · ${t().habitCount(nh)}</span></div>
  </button>`;
}

function renderChart() {
  const data = last7(); const max = Math.max(4, ...data.map(d => d.v));
  const W = 320, H = 110, padB = 18, padT = 14, bw = 26, gap = (W - bw * 7) / 6;
  const fmt = new Intl.DateTimeFormat(lang, { weekday: "short" });
  const grid = [0.5, 1].map(f => { const y = padT + (H - padB - padT) * (1 - f); return `<line class="grid" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`; }).join("");
  const bars = data.map((d, i) => {
    const h = Math.max(3, (H - padB - padT) * (d.v / max)); const x = i * (bw + gap); const y = H - padB - h; const isToday = i === 6;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="7" ${isToday ? 'fill="url(#gt)"' : 'class="bar"'}/>
      ${isToday ? `<text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" class="today-l">${d.v}</text>` : ""}
      <text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle" class="${isToday ? "today-l" : ""}">${fmt.format(d.d).replace(".", "")}</text>`;

// Jedna sekce: nahoře cíl dne (vybrané z „Na výběr“), pod ním úkoly s datem na dnešek a prošlé.
function renderGoals(d = todayISO()) {
  const future = d > todayISO();
  const all = goalItems(d).filter(i => i.kind === "t"); const goalIds = new Set(goalsOf(d));
  const dated = (future ? state.tasks.filter(x => x.date && x.date <= d && x.type !== "recurring" && taskIsOpen(x)).sort(byOrder) : overdueTasks()).filter(x => !goalIds.has("t:" + x.id));
  const isDone = i => i.kind === "h" ? !!i.x.log[d] : (i.x.type === "recurring" ? (!future && i.x.nextDue > todayISO()) : !!i.x.done);
  const items = all.filter(i => !isDone(i));
  const done = future ? { tasks: [], habits: [] } : { tasks: doneOn(d).tasks, habits: [] }; const nDone = done.tasks.length;
  const emptyTxt = all.length ? t().goalAllDone : t().goalEmpty;
  return `<section class="section goal" aria-labelledby="h-goal">
      <div class="section-head"><h2 id="h-goal">${t().goalTitle}</h2>
        <button class="btn-plus btn-edit-subtle" data-action="task-new-day" aria-label="${t().addTask}">${icon("plus")}</button></div>
      <div class="list glass">${(() => {
        // Dvě části podle druhu: Úkoly (vybrané i s datem) a Návyky.
        // Vybrané úkoly i úkoly s termínem jsou jeden seznam s vlastním pořadím (task.dayOrder, přetažením).
        const tList = [...items.filter(i => i.kind === "t").map(i => ({ x: i.x, m: "goal" })), ...dated.map(x => ({ x, m: "must" }))];
        tList.sort((a, b) => (a.x.dayOrder ?? 1e9) - (b.x.dayOrder ?? 1e9));
        const tRows = tList.map(o => renderTask(o.x, o.m)).join("");
        if (!tRows) return `<div class="empty">${emptyTxt}</div>`;
        return tRows;
      })()}</div>
      ${nDone ? `<button class="done-link" data-action="toggle-done-today" aria-expanded="${doneTodayOpen}">${t().doneToday} (${nDone})</button>
        ${doneTodayOpen ? `<div class="list glass">${done.tasks.map(x => doneRow(x.title, x.type === "recurring" ? "" : `data-action="task" data-id="${x.id}"`, "", (areaById(x.areaId) || {}).name || "")).join("")}${done.habits.map(h => doneRow(h.title, `data-action="habit" data-id="${h.id}"`, habitWeekDots(h), `${(areaById(h.areaId) || {}).name || ""} · ${t().habitTag}`)).join("")}</div>` : ""}` : ""}
    </section>`;
}
// Návyky v Cíli dne: všechny návyky na daný den jako dlaždice v řadě (swajp do boku).
// Klepnutí = splněno, podržení = nabídka „Dnes vynechat“. Vynechané jsou šedé na konci.
function habitsForDay(d) {
  const today = todayISO();
  const due = h => h.freq.type === "daily" || !!h.log[d] || (d === today ? habitWeekCount(h) < h.freq.times : true);
  const list = state.habits.filter(due);
  const skipped = h => !!(h.skips && h.skips[d]) && !h.log[d];
  return [...list.filter(h => !skipped(h)), ...list.filter(skipped)].map(h => ({ h, skipped: skipped(h) }));
}
function renderHabitStrip(d) {
  const list = habitsForDay(d); if (!list.length) return "";
  const future = d > todayISO();
  return `<section class="section hsection" aria-labelledby="h-habits">
    <div class="section-head"><h2 id="h-habits">${t().habits}</h2>
      <button class="btn-plus btn-edit-subtle" data-action="nav" data-view="habits" aria-label="${t().openHabits}">${icon("stats")}</button></div>
    <div class="hstrip" role="group" aria-labelledby="h-habits">${list.map(({ h, skipped }) => {
      const a = areaById(h.areaId) || noArea(); const on = !!h.log[d];
      return `<button class="htile ${on ? "on" : ""} ${skipped ? "skipped" : ""}" style="--area-c:${a.color}" data-htile="${h.id}" data-day="${d}"
        role="checkbox" aria-checked="${on}" aria-label="${esc(h.title)}${skipped ? ", " + t().skippedToday : ""}" ${future ? 'aria-disabled="true"' : ""}>
        <span class="htile-ico">${habitIcon(h, a)}</span>

        <span class="htile-week">${habitWeekDots(h, d)}<span class="htile-note">${skipped ? t().skippedShort : (() => { const r = new Date(d + "T12:00:00"); const mon = day(-((r.getDay() + 6) % 7), r);
          const x = Array.from({ length: 7 }, (_, i) => iso(day(i, mon))).filter(k => h.log[k]).length;
          return `${x}/${h.freq.type === "daily" ? 7 : h.freq.times}`; })()}</span></span>
      </button>`; }).join("")}</div>
  </section>`;
}

function openCalendar() {
  delete sheetEl.dataset.area;
  const sel = curDay(); const today = todayISO();
  if (!calMonth) calMonth = sel.slice(0, 7);
  const [y, m] = calMonth.split("-").map(Number);
  const first = new Date(y, m - 1, 1, 12); const startWd = (first.getDay() + 6) % 7;
  const daysIn = new Date(y, m, 0).getDate();
  const title = new Intl.DateTimeFormat(lang, { month: "long", year: "numeric" }).format(first).replace(/^./, c => c.toUpperCase());
  const wdNames = [0, 1, 2, 3, 4, 5, 6].map(i => new Intl.DateTimeFormat(lang, { weekday: "short" }).format(new Date(2024, 0, 1 + i, 12)).replace(".", ""));
  const planned = new Set(state.tasks.filter(x => x.date && x.type !== "recurring" && taskIsOpen(x)).map(x => x.date));
  const done = new Set(state.tasks.filter(x => x.doneAt).map(x => x.doneAt));
  state.habits.forEach(h => Object.keys(h.log).forEach(k => done.add(k)));
  let cells = "";
  for (let i = 0; i < startWd; i++) cells += `<span></span>`;
  for (let dd = 1; dd <= daysIn; dd++) {
    const k = `${y}-${String(m).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
    const dot = planned.has(k) ? (k < today ? "late" : "plan") : (done.has(k) && k <= today ? "done" : "");
    cells += `<button class="cal-d ${k === today ? "is-today" : ""} ${k === sel ? "is-sel" : ""}" data-action="cal-pick" data-day="${k}" aria-label="${k}">${dd}${dot ? `<i class="cal-dot ${dot}"></i>` : ""}</button>`;
  }
  openSheet(`${sheetHead(t().calendar)}
    <div class="cal-head">
      <button class="day-btn dark" data-action="cal-month" data-dir="-1" aria-label="${t().prevMonth}">${icon("back")}</button>
      <b>${title}</b>
      <button class="day-btn dark" data-action="cal-month" data-dir="1" aria-label="${t().nextMonth}">${icon("arrow")}</button>
    </div>
    <div class="cal-grid">${wdNames.map(w => `<span class="cal-wd">${w}</span>`).join("")}${cells}</div>
    <div class="cal-legend"><span><i class="cal-dot plan"></i>${t().legendPlan}</span><span><i class="cal-dot late"></i>${t().overdue}</span><span><i class="cal-dot done"></i>${t().legendDone}</span></div>
    <button class="btn btn-wide-ghost" data-action="day-today">${t().backToToday}</button>`);
}

function render() {

  const date = new Intl.DateTimeFormat(lang, { weekday: "long", day: "numeric", month: "long" }).format(now).replace(/^./, c => c.toUpperCase());

  let top, body, capture = "";
  if (v.name === "inbox") { top = topBlock(date, t().inboxTitle); body = renderInboxBody(); }
  else if (v.name === "areas") { top = topBlock(date, t().areasTitle, { back: areasFrom }); body = renderAreasBody(); }
  else if (v.name === "area") {
    const a = areaById(v.id);
    top = topBlock(t().areaLabel, a.name, { back: "areas", right: `<button class="icon-btn" data-action="area-edit" data-id="${a.id}" aria-label="${t().editArea}">${icon("pencil")}</button>` });
    body = renderAreaBody(a);
  }
  else if (v.name === "habits") { top = topBlock("", t().habitsTitle); body = renderHabitsBody(); }
  else if (v.name === "profile") { top = topBlock("", t().tabs.profile); body = renderProfileBody(); }
  else if (v.name === "profile-lang") { top = topBlock(t().tabs.profile, t().language, { back: "profile" }); body = renderLangBody(); }

  document.getElementById("app").innerHTML = `<section class="hero">${top}${capture}</section>` + body;
  // Týdny u návyků: výchozí je aktuální týden, po překreslení zůstane týden, kam uživatelka odswajpovala.
  document.querySelectorAll(".hc-weeks").forEach(el => {
    const pos = habitWeekPos[el.dataset.id];
    el.scrollLeft = pos == null ? el.scrollWidth : pos;
    el.addEventListener("scroll", () => {
      habitWeekPos[el.dataset.id] = el.scrollLeft + el.clientWidth >= el.scrollWidth - 4 ? null : el.scrollLeft;
    }, { passive: true });
  });
  if (key !== lastViewKey) {
    lastViewKey = key; archiveOpen = false;
    const sc = document.querySelector(".scroller"); if (sc && sc.scrollTo) sc.scrollTo(0, 0);
    window.scrollTo(0, 0);
  }

  const cur = v.name === "area" || v.name === "areas" ? areasFrom : v.name.startsWith("profile") ? "profile" : v.name;
  const tabs = [["home", "home2"], ["habits", "repeat"], ["inbox", "inbox"], ["profile", "user"]].filter(([k]) => k !== "inbox" || canUse("inbox"));
  document.getElementById("tabbar").innerHTML = tabs.map(([k, ic]) => `

    </button>`).join("");
  document.getElementById("tabbar").setAttribute("aria-label", t().tabs.home);

  if (!storage.ok) toast(t().storageOff);
}

function submitForm(form) {
  const f = new FormData(form); const id = form.dataset.id;
  const title = (f.get("title") || f.get("name") || "").toString().trim();
  if (!title) { toast(t().required); const inp = form.querySelector('[name="title"],[name="name"]'); if (inp) inp.focus(); return; }
  if (form.dataset.form === "habit" && !f.get("area")) { toast(t().needArea); return; }
  const snap = snapshot();
  if (form.dataset.form === "task") {
    const type = f.get("type") === "single" && f.get("list") ? "project" : f.get("type"); const priority = +f.get("priority") || 2;
    let task = id ? state.tasks.find(x => x.id === id) : null;
    const isNew = !task;
    if (!task) { task = { id: uid(), done: false }; state.tasks.push(task); }
    Object.assign(task, { title, areaId: (f.get("area") || "").toString(), priority, type });
    const dt = (f.get("date") || "").toString(); if (dt && type !== "recurring") task.date = dt; else delete task.date;
    const note = f.get("noteOn") ? (f.get("note") || "").toString().trim() : ""; if (note) task.note = note; else delete task.note;
    if (canUse("followUps")) { const fu = (f.get("followUp") || "").toString().split("\n").map(x => x.trim()).filter(Boolean).join("\n"); if (fu) task.followUp = fu; else delete task.followUp; }
    const gsel = (f.get("group_" + task.areaId) || "").toString(); const ar = areaById(task.areaId);
    if (gsel && ar && (ar.groups || []).some(g => g.id === gsel)) task.groupId = gsel; else delete task.groupId;
    if (type === "project") {
      const old = task.subtasks || [];
      const lines = f.get("steps").toString().split("\n").map(x => x.trim()).filter(Boolean);
      task.subtasks = lines.map(l => { const m = old.find(o => o.title === l); return m || { id: uid(), title: l, done: false }; });
      delete task.everyDays; delete task.nextDue;
    } else if (type === "recurring") {
      const pick = f.get("everyPick");
      task.everyDays = Math.max(1, Math.min(365, (pick && pick !== "custom" ? +pick : +f.get("every")) || 7));
      const st = (f.get("start") || "").toString();
      if (st) task.nextDue = st; else if (!task.nextDue) task.nextDue = todayISO();
      task.done = false; delete task.subtasks;
    } else { delete task.subtasks; delete task.everyDays; delete task.nextDue; }
    // Nový úkol z plusu u Cíle dne bez data: patří do cíle toho dne.
    const gd = form.dataset.goalDay;
    if (isNew && gd && f.get("toGoal") && !(task.date && task.date <= gd) && !(task.type === "recurring" && task.nextDue > gd)) setGoal("t", task.id, true, gd);
  } else if (form.dataset.form === "habit") {
    let h = id ? state.habits.find(x => x.id === id) : null;
    if (!h) { h = { id: uid(), log: {} }; state.habits.push(h); }
    h.title = title; h.areaId = f.get("area");
    h.freq = f.get("freq") === "weekly" ? { type: "weekly", times: +f.get("times") || 3 } : { type: "daily" };
    const hNote = f.get("noteOn") ? (f.get("note") || "").toString().trim() : ""; if (hNote) h.note = hNote; else delete h.note;
    const own = !!f.get("ownIcon");
    const hEmo = own ? firstGrapheme((f.get("emoji") || "").toString().trim()) : ""; const hIco = own ? (f.get("icon") || "").toString() : "";
    if (hEmo) { h.emoji = hEmo; delete h.icon; } else { delete h.emoji; if (hIco) h.icon = hIco; else delete h.icon; }
  } else if (form.dataset.form === "area") {
    let a = id ? areaById(id) : null; const isNew = !a;
    if (!a) { a = { id: uid() }; state.areas.push(a); }
    const emo = firstGrapheme((f.get("emoji") || "").toString().trim());
    if (emo) a.emoji = emo; else delete a.emoji;
    Object.assign(a, { name: title, icon: f.get("icon") || "other", color: f.get("color") || PALETTE[0],
      direction: f.get("direction").toString().trim(), context: f.get("context").toString().trim() });
    const oldG = a.groups || [];
    const names = (f.get("groups") || "").toString().split("\n").map(x => x.trim()).filter(Boolean);
    a.groups = [...new Set(names)].map(n => oldG.find(g => g.name === n) || { id: uid(), name: n });
    const keep = new Set(a.groups.map(g => g.id));
    state.tasks.forEach(x => { if (x.areaId === a.id && x.groupId && !keep.has(x.groupId)) delete x.groupId; });
    save(); closeSheet();
