/* ----- Přetažení řádků: podržet prst ~0,4 s, pak táhnout nahoru/dolů ----- */
const DRAG_HOLD_MS = 400;
const drag = { timer: null, el: null, row: null, active: false, y: 0, x0: 0, y0: 0, moved: false };
const dragItem = row => row.closest(".swipe") || row;
function dragSiblings() {
  const g = drag.row.dataset.dgroup; const parent = drag.el.parentElement;
  return [...parent.children].filter(c => { const r = c.matches("[data-drag]") ? c : c.querySelector(":scope > [data-drag]"); return r && r.dataset.dgroup === g; });
}
document.addEventListener("pointerdown", e => {
  const row = e.target.closest("[data-drag]"); if (!row || e.button > 0) return;
  clearTimeout(drag.timer);
  Object.assign(drag, { row, el: dragItem(row), active: false, x0: e.clientX, y0: e.clientY, moved: false });
  drag.timer = setTimeout(() => {
    if (swipe.moved) return;
    drag.active = true; swipe.el = null; closeSwipes();
    const r = drag.el.getBoundingClientRect(); drag.gx = drag.x0 - r.left; drag.gy = drag.y0 - r.top;
    drag.el.classList.add("drag-on"); drag.el.parentElement.classList.add("drag-list");
    drag.scale = drag.el.closest(".list") ? 1 : 1.05; // v seznamu se nezvětšuje, aby se neořízl o okraj karty
    drag.el.style.transform = `scale(${drag.scale})`;
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (err) {}
  }, DRAG_HOLD_MS);
}, true);
document.addEventListener("pointermove", e => {
  if (!drag.row) return;
  if (!drag.active) { if (Math.abs(e.clientX - drag.x0) > 8 || Math.abs(e.clientY - drag.y0) > 8) { clearTimeout(drag.timer); drag.row = null; } return; }
  drag.moved = true;
  const sibs = dragSiblings(); const me = drag.el;
  // Funguje pro seznam i mřížku: prohodí se s položkou, nad jejímž středem je prst.
  // Proti „třesení“: jen střední část cílové položky, po prohození krátká pauza a ostatní položky plynule dojedou (FLIP).
  const now = Date.now();
  if (now > (drag.lockUntil || 0)) for (const c of sibs) {
    if (c === me) continue;
    const r = c.getBoundingClientRect(); const mx = r.width * 0.25, my = r.height * 0.25;
    if (e.clientX < r.left + mx || e.clientX > r.right - mx || e.clientY < r.top + my || e.clientY > r.bottom - my) continue;
    const before = new Map(sibs.filter(x => x !== me).map(x => [x, x.getBoundingClientRect()]));
    if (me.compareDocumentPosition(c) & Node.DOCUMENT_POSITION_PRECEDING) c.before(me); else c.after(me);
    before.forEach((r0, x) => {
      const r1 = x.getBoundingClientRect(); const ddx = r0.left - r1.left, ddy = r0.top - r1.top;
      if (!ddx && !ddy) return;
      x.style.transition = "none"; x.style.transform = `translate(${ddx}px, ${ddy}px)`;
      requestAnimationFrame(() => { x.style.transition = "transform .2s ease"; x.style.transform = ""; });
    });

  }
  // Položka jede s prstem (posun počítaný od jejího aktuálního místa v rozložení).
  me.style.transform = "none"; const base = me.getBoundingClientRect();
  // V seznamu jen nahoru/dolů, v mřížce kategorií volně.
  const dx = me.closest(".list, .hcards") ? 0 : e.clientX - drag.gx - base.left;
  me.style.transform = `translate(${dx}px, ${e.clientY - drag.gy - base.top}px) scale(${drag.scale})`;
}, true);
function endDrag() {

const swipe = { el: null, x0: 0, y0: 0, dx: 0, base: 0, axis: null, moved: false };

    case "goal": { const kind = el.dataset.kind, d = curDay(); const u = toggleGoal(kind, id, d); render(); toast(isGoal(kind, id, d) ? t().goalAdded : t().goalRemoved, u); break; }
    case "hide-day": { // Na výběr: skrýt úkol jen pro tento den, zítra se nabídne znovu (termín se nemění)
      const x = state.tasks.find(x => x.id === id); const d = curDay();
      x.skipDays = x.skipDays || {}; x.skipDays[d] = true; save(); render();
      toast(t().skippedToast, () => { delete x.skipDays[d]; save(); }); break;
    }
    case "skip": { const u = moveGoalNextDay("t", id, () => skipToday(id, curDay())); render(); toast(t().skippedToast, u); break; }
    case "archive": archiveOpen = !archiveOpen; render(); break;
    case "start-own": confirmDialog(t().startOwnConfirm, t().startOwnOk, () => { startOwnData(); closeSheet(); go(""); toast(t().startOwnDone); }); break;
    case "settings": go("profile"); break;
    case "areas-open": areasFrom = el.dataset.from || "home"; go("areas"); break;
    case "close": closeSheet(); break;
    case "soon": toast(t().soon); break;
    case "nav": { const v = el.dataset.view; if (v === "home" && view().name === "home") selectedDay = null; go(v === "home" ? "" : v); break; }
    case "inbox-delete": { const u = deleteInbox(id); render(); toast(t().deleted, u); break; }
    case "inbox-sort": openSort(id); break;
    case "sort-area": sortChoice.areaId = el.dataset.area; openSort(sortChoice.id); break;
    case "sort-prio": sortChoice.priority = +el.dataset.prio; openSort(sortChoice.id); break;
    case "sort-confirm": { const a = areaById(sortChoice.areaId); const u = sortInbox(sortChoice.id, sortChoice.areaId, sortChoice.priority); closeSheet(); render(); toast(t().sortedTo(a.name), u); break; }
    case "lang": lang = el.dataset.lang; prefs.lang = lang; savePrefs(); render(); break;
    case "paste-open": { const b = document.getElementById("paste-box"); b.hidden = !b.hidden; if (!b.hidden) document.getElementById("paste-text").focus(); break; }
    case "paste-load": {
      const txt = document.getElementById("paste-text").value.trim();
      if (!txt) { toast(t().pasteEmpty); break; }
      try { const o = JSON.parse(txt); migrate(JSON.parse(JSON.stringify(o && o.app === "hub" ? o.data : o))); }
      catch (err) { toast(t().importBad); break; }
      confirmDialog(t().pasteConfirm, t().replace, () => {
        const snap = snapshot();
        try { importBackup(txt); closeSheet(); render(); toast(t().importOk, restore(snap)); } catch (err) { toast(t().importBad); }
      });
      break;
    }
    case "backup-file": {
      // Záloha jako soubor: na iPhonu se otevře nabídka sdílení (Uložit do Souborů, AirDrop, Zprávy…), jinde se soubor stáhne.
      const json = exportBackup();
      document.getElementById("lb").textContent = new Intl.DateTimeFormat(lang, { dateStyle: "medium", timeStyle: "short" }).format(new Date(state.meta.lastBackup));
      const name = `taskhub-zaloha-${todayISO()}.json`;
      try {
        const file = new File([json], name, { type: "application/json" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); toast(t().backupSaved); break; }
      } catch (err) { if (err && err.name === "AbortError") break; }
      try {
        const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
        const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000); toast(t().backupSaved);
      } catch (err) { toast(t().copyFailed); }
      break;
    }
    case "copy": {
      const json = exportBackup();
      document.getElementById("lb").textContent = new Intl.DateTimeFormat(lang, { dateStyle: "medium", timeStyle: "short" }).format(new Date(state.meta.lastBackup));
      try { await navigator.clipboard.writeText(json); toast(t().copied); }
      catch (err) { const d = document.getElementById("dump"); d.hidden = false; d.value = json; d.select(); toast(t().copyFailed); }
      break;
    }
    case "reset": confirmDialog(t().resetConfirm, t().replace, () => { state = sampleData(); save(); closeSheet(); render(); }); break;
  }
});
document.addEventListener("change", e => {
  const form = e.target.closest("form[data-form]"); if (!form) return;
  if (e.target.name === "type") form.dataset.type = e.target.value;
  // Výběr předvolené ikony zruší emoji: plusko přestane být vybrané i aktivní a nabídka emoji se zavře.
  if (e.target.name === "icon") { const em = form.querySelector('[name="emoji"]'); if (em) { em.value = ""; const c = form.querySelector(".chip-emoji"); c.classList.remove("is-on"); c.querySelector(".emoji-val").textContent = ""; c.setAttribute("aria-expanded", "false"); c.blur(); const pnl = form.querySelector(".emoji-panel"); if (pnl) pnl.hidden = true; } }
  if (e.target.name === "emoji") onEmojiInput(e.target);
  if (e.target.name === "list") { form.dataset.list = e.target.checked ? "on" : "off"; growAll(form); }
  if (e.target.name === "noteOn") { form.dataset.note = e.target.checked ? "on" : "off"; if (e.target.checked) { growAll(form); form.querySelector('[name="note"]').focus(); } }
  if (e.target.name === "ownIcon") form.dataset.ownIcon = e.target.checked ? "on" : "off";
  if (e.target.name === "date" || e.target.name === "start") {
    const box = e.target.closest(".field"); box.classList.toggle("has-date", !!e.target.value);
    box.querySelector(".date-text").textContent = !e.target.value ? t().dateNone : (e.target.name === "start" && e.target.value === todayISO() ? t().today : fmtDateLong(e.target.value));
  }
  if (e.target.dataset.label) { const box = e.target.closest(".cat-field"); box.querySelector(".cat-name").textContent = e.target.dataset.label; box.querySelector(".cat-list").hidden = true; box.querySelector(".cat-head").setAttribute("aria-expanded", "false"); }
  if (e.target.name === "area") {
    form.querySelectorAll(".f-group").forEach(el => { el.hidden = el.dataset.forArea !== e.target.value; });
    const box = e.target.closest(".cat-field"); const a = areaById(e.target.value) || noArea();
    if (box) {
      const v = box.querySelector(".cat-val"); v.style.setProperty("--area-c", a.color); v.classList.toggle("is-none", !a.id);
      v.querySelector(".ico").innerHTML = areaIcon(a); v.querySelector(".cat-name").textContent = a.name;
      box.querySelector(".cat-list").hidden = true; box.querySelector(".cat-head").setAttribute("aria-expanded", "false");
    }
  }
  if (e.target.name === "freq") form.dataset.freq = e.target.value;
  if (e.target.name === "everyPick") {
    const box = form.querySelector(".f-recurring-extra"); box.dataset.every = e.target.value;
    if (e.target.value === "custom") { const inp = box.querySelector(".f-every-custom"); inp.focus(); inp.select && inp.select(); }
  }
});
document.addEventListener("submit", e => {
  const form = e.target.closest("form[data-form]");
  if (form) { e.preventDefault(); submitForm(form); return; }
  if (e.target.id === "quick-form") {
    e.preventDefault();
    const inp = document.getElementById("quick-input"); const text = inp.value.trim();
    if (!text) { toast(t().emptyCapture); inp.focus(); return; }
    const u = addInbox(text); closeSheet(); render(); toast(t().added, u); return;
  }
  if (e.target.id !== "capture") return;
  e.preventDefault();
  const input = document.getElementById("capture-input"); const text = input.value.trim();
  if (!text) { toast(t().emptyCapture); input.focus(); return; }
  const u = addInbox(text); render(); toast(t().added, u);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "gchip-input") { e.preventDefault(); gchipsAdd(e.target.closest("form")); return; }
  if (e.key === "Escape") { if (!dialogEl.hidden) dialogEl.hidden = true; else if (!sheetEl.hidden) closeSheet(); }
});

window.addEventListener("hashchange", render);
// Offline: service worker (jen když ho prostředí dovolí, v náhledu artefaktu se tiše přeskočí)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) { /* bez offline režimu */ }
}
load();
render();
{ const c = document.getElementById("clock"); const n = new Date(); c.textContent = `${n.getHours()}:${String(n.getMinutes()).padStart(2, "0")}`; }
</script>
